function uploadExcelFile(){
  const i=document.createElement('input');
  i.type='file';
  i.accept='.xlsx,.xls,.csv';
  i.onchange=e=>{
    const f=e.target.files[0];
    if(!f)return;
    showToast('⏳ در حال پردازش...');
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const data=ev.target.result;
        let parsed=[];
        if(f.name.endsWith('.csv')){
          // Parse CSV
          const lines=data.split('\n').filter(l=>l.trim());
          lines.forEach(line=>{
            const p=line.split(',');
            parsed.push(p);
          });
        }else{
          // For xlsx, try to use Sheet.js if available, otherwise prompt user to use CSV
          if(typeof XLSX==='undefined'){
            // Load Sheet.js dynamically
            await new Promise((res,rej)=>{
              const s=document.createElement('script');
              s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
              s.onload=res;s.onerror=rej;
              document.head.appendChild(s);
            });
          }
          if(typeof XLSX!=='undefined'){
            const wb=XLSX.read(data,{type:'array'});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const csv=XLSX.utils.sheet_to_csv(ws);
            const lines=csv.split('\n').filter(l=>l.trim());
            lines.forEach(line=>{
              const p=line.split(',');
              parsed.push(p);
            });
          }
        }
        if(parsed.length===0){showToast('❌ فایل خالی است');return;}
        // Process parsed data (same as paste)
        ensureClass(S.currentClass);
        let c=0;
        parsed.forEach(line=>{
          if(!line||!line[0])return;
          const name=line[0].trim();
          if(!name)return;
          let st=S.classes[S.currentClass].students.find(s=>(s.name||s)===name);
          if(!st){st={name};S.classes[S.currentClass].students.push(st);}
          if(line[1])st.nationalId=line[1].trim();
          if(line[2])st.fatherName=line[2].trim();
          if(line[3])st.motherName=line[3].trim();
          if(line[4])st.address=line[4].trim();
          if(line[5])st.phone=line[5].trim();
          if(line[6])st.birthDate=line[6].trim();
          c++;
        });
        saveS();
        renderInfo();
        showToast('✅ '+c+' رکورد وارد شد');
      }catch(err){showToast('❌ خطا: '+err.message);}
    };
    if(f.name.endsWith('.csv')){
      reader.readAsText(f,'utf-8');
    }else{
      reader.readAsArrayBuffer(f);
    }
  };
  i.click();
}

function pasteInfo(){showToast('📋 از اکسل کپی کنید سپس Ctrl+V');const h=(e)=>{e.preventDefault();const txt=e.clipboardData.getData('text/plain');const lines=txt.split('\n').filter(l=>l.trim());ensureClass(S.currentClass);let c=0;lines.forEach(line=>{const p=line.split('\t');const name=p[0]?.trim();if(!name)return;let st=S.classes[S.currentClass].students.find(s=>(s.name||s)===name);if(!st){st={name};S.classes[S.currentClass].students.push(st);}if(p[1])st.nationalId=p[1].trim();if(p[2])st.fatherName=p[2].trim();if(p[3])st.motherName=p[3].trim();if(p[4])st.address=p[4].trim();if(p[5])st.phone=p[5].trim();if(p[6])st.birthDate=p[6].trim();c++;});saveS();renderInfo();showToast('✅ '+tp(c)+' رکورد وارد شد');document.removeEventListener('paste',h);};document.addEventListener('paste',h);}

// ====== SVG CHARTS ======
function renderCharts(cls,students,classAvg,praises,negDisc,negHw){
  let h='';
  // Helper: get class data with variant-aware lookup (Persian/Latin digits)
  const getClassObj=(c)=>{
    const latin=String(c).replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
    const persian=String(c).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
    return S.classes?.[c]||S.classes?.[persian]||S.classes?.[latin]||{};
  };
  const classObj=getClassObj(cls);
  // 1. Subject averages bar chart
  let subjectData=SB.map(sj=>{
    let sg=[];
    MS.forEach(m=>{const sd=classObj.data?.[m]?.[sj]||{};Object.entries(sd).forEach(([d,sd_])=>{Object.values(sd_).forEach(e=>{if(e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});});});
    return {subject:sj,avg:sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0};
  });
  const maxBar=180;
  const barWidth=50;
  h+=`<div><div class="section-title">📊 میانگین نمرات به تفکیک درس</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;overflow-x:auto;">`;
  h+=`<svg width="${subjectData.length*barWidth+40}" height="220" style="display:block;margin:0 auto;">`;
  // Y axis
  h+=`<line x1="30" y1="20" x2="30" y2="200" stroke="var(--border)" stroke-width="1"/>`;
  h+=`<line x1="30" y1="200" x2="${subjectData.length*barWidth+40}" y2="200" stroke="var(--border)" stroke-width="1"/>`;
  // Y axis labels
  for(let i=0;i<=10;i+=2){
    const y=200-(i/10)*180;
    h+=`<text x="25" y="${y+4}" text-anchor="end" font-size="10" fill="var(--text-light)">${tp(i)}</text>`;
    h+=`<line x1="28" y1="${y}" x2="${subjectData.length*barWidth+40}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>`;
  }
  // Bars
  const colors=['var(--primary)','var(--secondary)','var(--accent)'];
  subjectData.forEach((d,i)=>{
    const x=40+i*barWidth;
    const barH=(d.avg/10)*180;
    const y=200-barH;
    h+=`<rect x="${x}" y="${y}" width="30" height="${barH}" fill="${colors[i%3]}" rx="4"/>`;
    h+=`<text x="${x+15}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--text)">${d.avg>0?toPer(d.avg.toFixed(1)):'—'}</text>`;
    h+=`<text x="${x+15}" y="215" text-anchor="middle" font-size="11" fill="var(--text-light)">${d.subject}</text>`;
  });
  h+=`</svg></div></div>`;
  // 2. Discipline distribution pie chart (donut)
  const total=praises+negDisc+negHw;
  if(total>0){
    h+=`<div style="margin-top:16px;"><div class="section-title">🍩 توزیع موارد (انضباط + تکلیف)</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;">`;
    const cx=80,cy=80,r=60,rInner=35;
    let startAngle=-Math.PI/2;
    const slices=[
      {label:'⭐ تشویق',value:praises,color:'#2D8659'},
      {label:'⚠️ انضباط منفی',value:negDisc,color:'#DC2626'},
      {label:'📚 تکلیف نامطلوب',value:negHw,color:'#D97706'}
    ];
    let svg=`<svg width="160" height="160" viewBox="0 0 160 160">`;
    slices.forEach(s=>{
      if(s.value===0)return;
      const angle=(s.value/total)*2*Math.PI;
      const endAngle=startAngle+angle;
      const x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
      const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
      const x1i=cx+rInner*Math.cos(endAngle),y1i=cy+rInner*Math.sin(endAngle);
      const x2i=cx+rInner*Math.cos(startAngle),y2i=cy+rInner*Math.sin(startAngle);
      const largeArc=angle>Math.PI?1:0;
      svg+=`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${x1i} ${y1i} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2i} ${y2i} Z" fill="${s.color}" stroke="white" stroke-width="2"/>`;
      startAngle=endAngle;
    });
    svg+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)">${tp(total)}</text>`;
    svg+=`</svg>`;
    h+=svg;
    h+=`<div style="display:grid;gap:6px;font-size:12px;">`;
    slices.forEach(s=>{
      h+=`<div style="display:flex;align-items:center;gap:8px;"><span style="width:12px;height:12px;background:${s.color};border-radius:3px;"></span><span>${s.label}</span><b>${tp(s.value)}</b> <span style="color:var(--text-light);">(${total>0?toPer(Math.round(s.value/total*100)):0}%)</span></div>`;
    });
    h+=`</div></div></div>`;
  }
  // 3. Top students horizontal bar chart
  let studentAvgs=students.map(s=>{
    const name=s.name||s;
    let sg=[];
    MS.forEach(m=>{SB.forEach(sj=>{const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[name];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});});});
    return {name,avg:sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0,count:sg.length};
  }).filter(s=>s.count>0).sort((a,b)=>b.avg-a.avg).slice(0,5);
  if(studentAvgs.length>0){
    h+=`<div style="margin-top:16px;"><div class="section-title">🏆 ۵ نفر برتر کلاس</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;">`;
    const maxW=300;
    studentAvgs.forEach((s,i)=>{
      const w=(s.avg/10)*maxW;
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'  ';
      h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;"><span style="width:30px;text-align:center;">${medal}</span><span style="width:100px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.name}</span><div style="height:18px;width:${w}px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;color:white;font-weight:bold;font-size:11px;">${toPer(s.avg.toFixed(1))}</div></div>`;
    });
    h+=`</div></div>`;
  }
  return h;
}

function addMeeting(){
  const date=document.getElementById('mt-date').value.trim();
  const time=document.getElementById('mt-time').value.trim();
  const student=document.getElementById('mt-student').value;
  const topic=document.getElementById('mt-topic').value.trim();
  const notes=document.getElementById('mt-notes').value.trim();
  const fileInput=document.getElementById('mt-file');
  if(!date){showToast('تاریخ لازم است');return;}
  const holName=getPersianHolidayName(date);
  if(holName){if(!confirm('⚠️ این روز تعطیل است ('+holName+'). آیا مطمئن هستید؟'))return;}
  const meeting={date,time,student,topic,notes,class:S.currentClass,file:null,fileName:null};
  
  function finalizeMeeting(){
    if(!S.meetings)S.meetings=[];
    S.meetings.push(meeting);saveS();renderMeetings();
    showToast('✅ ملاقات ثبت شد');
    // Auto-send message to parent(s)
    notifyParentsAboutMeeting(meeting);
  }
  
  if(fileInput.files&&fileInput.files[0]){
    const f=fileInput.files[0];
    if(f.size>500000){showToast('⚠️ فایل بزرگ است (حداکثر ۵۰۰KB)');return;}
    const r=new FileReader();
    r.onload=e=>{meeting.file=e.target.result;meeting.fileName=f.name;finalizeMeeting();};
    r.readAsDataURL(f);
  }else{
    finalizeMeeting();
  }
}

// Auto-notify parents about scheduled meeting
async function notifyParentsAboutMeeting(meeting){
  try{
    const sb=getSupabase();
    if(!sb)return;
    const userId=localStorage.getItem('portal_user_id');
    const cls=meeting.class||S.currentClass;
    
    // Build message text
    let msg='📋 جلسه ملاقات اولیا\n';
    msg+='📅 تاریخ: '+meeting.date+'\n';
    if(meeting.time)msg+='⏰ ساعت: '+meeting.time+'\n';
    if(meeting.student)msg+='👤 دانش‌آموز: '+meeting.student+'\n';
    else msg+='👨‍👩‍👧 برای: همه کلاس '+cls+'\n';
    if(meeting.topic)msg+='📝 موضوع: '+meeting.topic+'\n';
    if(meeting.notes)msg+='📝 توضیحات: '+meeting.notes+'\n';
    msg+='\nلطفاً در زمان مشخصه حضور داشته باشید.';
    
    // Find parent user(s) to notify
    // If meeting is for a specific student, find their parent
    // If for all class, find all parents in the class
    let targetParents=[];
    if(meeting.student){
      // Find parent for this specific student
      // Parent username pattern: parent_XX_YY where XX=class number
      const clsNum=cls.includes('۱')?'61':cls.includes('۲')?'62':cls.includes('۳')?'63':'';
      // Search users table for parents in this class
      const{data:parents}=await sb.from('users').select('id,username,name,class_code').eq('role','PARENT').eq('class_code',cls);
      if(parents){
        // Match parent by student name (parent name contains student name)
        targetParents=parents.filter(p=>p.name.includes(meeting.student));
      }
    }else{
      // All parents in class
      const{data:parents}=await sb.from('users').select('id,username,name,class_code').eq('role','PARENT').eq('class_code',cls);
      targetParents=parents||[];
    }
    
    if(targetParents.length===0){
      console.log('No parents found to notify');
      return;
    }
    
    // Send message to each parent
    let sent=0;
    for(const parent of targetParents){
      try{
        const{error}=await sb.from('messages').insert({
          from_user_id:userId,
          to_user_id:parent.id,
          subject:null,
          body:msg,
          file_data:null,
          file_name:null,
          read:false
        });
        if(!error)sent++;
      }catch(e){}
    }
    
    if(sent>0){
      showToast('✅ پیام ملاقات برای '+sent+' ولی ارسال شد');
    }
  }catch(e){
    console.log('Meeting notification error:',e.message);
  }
}

// ====== SUBJECT MANAGEMENT ======
function addSubject(){
  const v=document.getElementById('new-subject').value.trim();
  if(!v){showToast('نام درس را وارد کنید');return;}
  if(!S.subjects)S.subjects=[...SB];
  if(S.subjects.includes(v)){showToast('تکراری');return;}
  S.subjects.push(v);
  syncSB();saveS();syncSettingsToDB();
  // Update current subject if needed
  if(!S.subjects.includes(S.currentSubject))S.currentSubject=S.subjects[0];
  renderSettingsPage();showToast('✅ درس افزوده شد');
  // Update subnav if visible
  if(document.getElementById('sel-subject'))fillSubnav();
  // Re-render current view to show new subject
  const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
  if(activeView)switchView(activeView);
}
function renameSubject(i,newName){
  newName=newName.trim();
  if(!newName)return;
  if(!S.subjects)S.subjects=[...SB];
  const oldName=S.subjects[i];
  if(oldName===newName)return;
  if(S.subjects.includes(newName)){showToast('نام تکراری');renderSettingsPage();return;}
  S.subjects[i]=newName;
  // Migrate data
  Object.keys(S.classes).forEach(cls=>{
    Object.keys(S.classes[cls]?.data||{}).forEach(m=>{
      if(S.classes[cls].data[m][oldName]){
        S.classes[cls].data[m][newName]=S.classes[cls].data[m][oldName];
        delete S.classes[cls].data[m][oldName];
      }
    });
  });
  if(S.currentSubject===oldName)S.currentSubject=newName;
  syncSB();saveS();syncSettingsToDB();showToast('✅ تغییر نام داده شد');
  fillSubnav();
  // Re-render current view
  const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
  if(activeView)switchView(activeView);
}
function removeSubject(i){
  if(!S.subjects)S.subjects=[...SB];
  if(S.subjects.length<=1){showToast('حداقل یک درس لازم است');return;}
  if(!confirm('این درس و همه نمراتش حذف شود؟'))return;
  const removed=S.subjects[i];
  S.subjects.splice(i,1);
  // Clean up data
  Object.keys(S.classes).forEach(cls=>{
    Object.keys(S.classes[cls]?.data||{}).forEach(m=>{
      if(S.classes[cls].data[m][removed])delete S.classes[cls].data[m][removed];
    });
  });
  if(S.currentSubject===removed)S.currentSubject=S.subjects[0];
  syncSB();saveS();syncSettingsToDB();renderSettingsPage();showToast('🗑️ درس حذف شد');
  fillSubnav();
  // Re-render current view to update subject dropdown
  const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
  if(activeView)switchView(activeView);
}
// ====== HOMEWORK OPTIONS ======
function addHomeworkOpt(){
  const v=document.getElementById('new-hw').value.trim();
  if(!v){showToast('متن وارد کنید');return;}

function enableDragReorder(){
  const list=document.getElementById('student-list');if(!list)return;
  const items=Array.from(list.querySelectorAll('.student-item'));
  let dragSrc=null;
  items.forEach(item=>{
    item.addEventListener('dragstart',function(e){
      dragSrc=this;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',this.dataset.idx);
    });
    item.addEventListener('dragend',function(){
      this.classList.remove('dragging');
      items.forEach(it=>it.classList.remove('drag-over'));
      const cls=S.currentClass;
      const oldStudents=S.classes[cls].students.slice();
      const newOrder=[];
      const domOrder=Array.from(list.querySelectorAll('.student-item')).map(el=>parseInt(el.dataset.idx));
      domOrder.forEach(oldIdx=>{if(!isNaN(oldIdx)&&oldStudents[oldIdx])newOrder.push(oldStudents[oldIdx]);});
      S.classes[cls].students=newOrder;saveS();renderSettingsPage();
    });
    item.addEventListener('dragover',function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      if(dragSrc&&dragSrc!==this){
        const r=this.getBoundingClientRect();
        const mid=r.top+r.height/2;
        if(e.clientY<mid){this.parentNode.insertBefore(dragSrc,this);}
        else{this.parentNode.insertBefore(dragSrc,this.nextSibling);}
      }
    });
  });
}

function renderCalendar(){
  const main=document.getElementById('view-calendar');
  const cls=S.currentClass;
  const meetings=S.meetings||[];

  const month=S.currentMonth;
  const monthNum=PMN[month];
  const year=monthNum>=7?1405:1406;
  // Build calendar
  const daysInMonth=31; // simplified
  const startDay=0; // simplified - start from Saturday
  const persianDays=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  let h='<div class="report-header"><div style="font-size:12px;opacity:0.8;">📅 تقویم رویدادها</div><div style="font-size:20px;font-weight:bold;margin-top:4px;">'+month+' '+tp(year)+'</div></div>';

  h+='<div style="display:flex;gap:8px;justify-content:center;margin:12px 0;"><button onclick="changeCalendarMonth(-1)" class="quick-btn">→ ماه قبل</button><button onclick="changeCalendarMonth(1)" class="quick-btn">ماه بعد ←</button></div>';

  h+='<div class="cal-grid">';

    const dateStr=tp(year,4)+'/'+tp(monthNum,2)+'/'+tp(day,2);

// ====== LOTTERY WHEEL ======
function renderLottery(){
  const main=document.getElementById('view-lottery');
  const students=getStudents();
  if(students.length===0){main.innerHTML='<div class="settings-section"><p style="color:var(--text-light)">دانش‌آموزی ثبت نشده</p></div>';return;}
  let h='<div class="report-header"><div style="font-size:12px;opacity:0.8;">🎡 چرخه تقدیر</div><div style="font-size:20px;font-weight:bold;margin-top:4px;">انتخاب تصادفی دانش‌آموز — '+tp(students.length)+' نفر</div></div>';
  h+='<div class="lottery-wheel-container">';
  // Adjust wheel size and font based on student count
  const wheelSize=students.length>20?360:students.length>12?320:300;
  const fontSize=students.length>20?2:students.length>12?2.5:3;
  const textRadius=students.length>20?28:students.length>12?26:25;
  // Build wheel SVG with ALL students
  h+='<div style="position:relative;">';
  h+='<div class="lottery-pointer">⬇️</div>';
  h+='<svg width="'+wheelSize+'" height="'+wheelSize+'" class="lottery-wheel" id="lottery-wheel" viewBox="0 0 100 100">';
  const slice=360/students.length;
  const colors=['#0F4C5C','#FF6B35','#2D8659','#D97706','#5F7A6B','#DC2626','#5BAFBF','#FF8C5F','#7E22CE','#0891B2','#9D174D','#4338CA'];
  students.forEach((s,i)=>{
    const angle=slice*i;
    const rad=angle*Math.PI/180;
    const x1=50+40*Math.cos(rad-90*Math.PI/180);
    const y1=50+40*Math.sin(rad-90*Math.PI/180);
    const rad2=(angle+slice)*Math.PI/180;
    const x2=50+40*Math.cos(rad2-90*Math.PI/180);
    const y2=50+40*Math.sin(rad2-90*Math.PI/180);
    // For wheels with many slices, use larger arc-flag (1 if slice>180)
    const largeArc=slice>180?1:0;
    h+='<path d="M 50 50 L '+x1.toFixed(2)+' '+y1.toFixed(2)+' A 40 40 0 '+largeArc+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+colors[i%colors.length]+'" stroke="white" stroke-width="0.3"/>';
    // Text — use just first name, truncated based on student count
    const midAngle=(angle+slice/2)*Math.PI/180;
    const tx=50+textRadius*Math.cos(midAngle-90*Math.PI/180);
    const ty=50+textRadius*Math.sin(midAngle-90*Math.PI/180);
    // For larger classes, show only initials or just the number
    let label;
    if(students.length>30){
      // Just numbers 1, 2, 3...
      label=String(i+1);
    }else if(students.length>20){
      // First name truncated to 4 chars
      label=(s.name||s).split(' ')[0].slice(0,4);
    }else{
      // First name truncated to 5 chars
      label=(s.name||s).split(' ')[0].slice(0,5);
    }
    h+='<text x="'+tx.toFixed(2)+'" y="'+ty.toFixed(2)+'" text-anchor="middle" font-size="'+fontSize+'" fill="white" font-weight="bold" transform="rotate('+(angle+slice/2)+' '+tx.toFixed(2)+' '+ty.toFixed(2)+')">'+label+'</text>';
  });
  h+='</svg>';
  h+='</div>';
  // For larger classes, show a numbered list next to the wheel
  if(students.length>30){

  h+='<div style="margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:11px;"><label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="lottery-no-repeat" style="width:14px;height:14px;"> 🎯 حالت تکرار-ندادن (تا همه نبرند، کسی دوباره برنده نشود)</label><span style="background:var(--hover);padding:4px 10px;border-radius:8px;">بردگان: <span id="lottery-picked-count">۰ / '+toPer(students.length)+'</span></span></div>';

function renderLotteryHistory(){
  const histEl=document.getElementById('lottery-history');
  if(!histEl)return;
  const hist=S.lotteryHistory||[];
  if(hist.length===0){histEl.innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">هنوز انتخابی ثبت نشده</div>';return;}
  histEl.innerHTML=hist.slice(0,10).map((h,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;"><span style="font-weight:bold;">${tp(i+1)}. ${h.name}</span><span style="color:var(--text-light);">${h.time}</span></div>`).join('');
}
function spinLottery(){
  const students=getStudents();
  if(students.length===0)return;
  const wheel=document.getElementById('lottery-wheel');
  const result=document.getElementById('lottery-result');
  // Track cumulative rotation so the wheel always spins forward (never snaps back)
  if(!window._lotteryRotation)window._lotteryRotation=0;
  // Pick winner — truly uniform random across all students (equal chance for everyone)
  // If "no-repeat" mode is on, exclude already-picked students (until everyone has won)
  const useNoRepeat=document.getElementById('lottery-no-repeat')?.checked;
  if(!window._lotteryPickedNames)window._lotteryPickedNames=[];
  let pool=students;
  if(useNoRepeat){
    pool=students.filter(s=>window._lotteryPickedNames.indexOf(s.name||s)<0);
    if(pool.length===0){
      // All students have been picked — reset
      window._lotteryPickedNames=[];
      pool=students;
      showToast('🔄 همه دانش‌آموزان بردند — فهرست از نو');
    }
  }
  const winner=pool[Math.floor(Math.random()*pool.length)];
  const winnerName=winner.name||winner;
  const winnerIndex=students.indexOf(winner);
  const slice=360/students.length;
  const winnerMidAngle=winnerIndex*slice+slice/2;
  // Compute target rotation: always add at least 5 full rotations + land at winner's slice
  const targetMod=(360-winnerMidAngle)%360;
  const currentMod=((window._lotteryRotation%360)+360)%360;
  const deltaToTarget=(targetMod-currentMod+360)%360;
  // Add 5-7 full rotations + small random jitter within the slice (so visual is dynamic)
  const jitter=Math.floor(Math.random()*slice*0.5-slice*0.25);
  window._lotteryRotation+=360*5+deltaToTarget+jitter;
  wheel.style.transform='rotate('+window._lotteryRotation+'deg)';
  result.style.display='none';
  setTimeout(()=>{
    result.style.display='block';
    result.className='lottery-result';
    result.innerHTML='🎉 برنده: '+winnerName;
    // Track picked name (for no-repeat mode)
    if(useNoRepeat&&window._lotteryPickedNames.indexOf(winnerName)<0){
      window._lotteryPickedNames.push(winnerName);
    }
    // Save to history
    if(!S.lotteryHistory)S.lotteryHistory=[];
    const now=new Date().toLocaleString('fa-IR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
    S.lotteryHistory.unshift({name:winnerName,time:now});
    if(S.lotteryHistory.length>50)S.lotteryHistory=S.lotteryHistory.slice(0,50);
    saveS();
    renderLotteryHistory();
    // Update no-repeat counter display
    const counter=document.getElementById('lottery-picked-count');
    if(counter){
      counter.textContent=toPer(window._lotteryPickedNames.length)+' / '+toPer(students.length);
    }
  },4200);
}

function loadBirthdays(){
  const sb=getSupabase();
  if(!sb){document.getElementById('birthdays-list').innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">آنلاین نیستید</div>';return;}
  sb.from('settings').select('key,value').then(({data,error})=>{
    if(error||!data){document.getElementById('birthdays-list').innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">داده‌ای یافت نشد</div>';return;}
    _birthdaysCache={};
    data.forEach(row=>{
      if(row.key&&row.key.indexOf('birthdays_')===0){
        const cls=row.key.replace('birthdays_','');
        try{_birthdaysCache[cls]=JSON.parse(row.value);}catch(e){}
      }
    });
    renderTodaysBirthdays();
  }).catch(e=>{console.log('Birthday load error:',e.message);document.getElementById('birthdays-list').innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">خطا در بارگذاری</div>';});
}
function renderTodaysBirthdays(){
  const el=document.getElementById('birthdays-list');
  if(!el)return;
  // Get today's month/day in Persian Shamsi format
  const todayParts=new Date().toLocaleDateString('fa-IR-u-nu-latn',{month:'2-digit',day:'2-digit'}).split('/');
  const todayMonthDay=todayParts[0]+'/'+todayParts[1];
  // Persian-digit variant for matching
  const toFa=s=>String(s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  // Collect today's birthdays across ALL class keys (including "۶" master list)
  const todayBdays=[];
  Object.keys(_birthdaysCache).forEach(cls=>{
    const students=_birthdaysCache[cls]||[];
    students.forEach(s=>{
      if(s.bd){
        const parts=String(s.bd).split('/');
        if(parts.length>=3){
          const md=parts[1]+'/'+parts[2];
          // Try matching with various digit forms
          const mdFa=toFa(md);
          const todayFa=toFa(todayMonthDay);
          const todayPersian=toFa(todayMonthDay);
          if(mdFa===todayFa||md===todayMonthDay||mdFa===todayPersian){
            // Avoid duplicates (same student in multiple lists)
            const exists=todayBdays.find(b=>b.name===s.name);
            if(!exists){
              todayBdays.push({name:s.name,class:cls,birthDate:s.bd});
            }
          }
        }
      }
    });
  });
  if(todayBdays.length===0){
    el.innerHTML='<div style="padding:8px 12px;background:var(--hover);border-radius:8px;font-size:12px;color:var(--text-light);text-align:center;">🎈 امروز تولد کسی نیست</div>';
    return;
  }
  let html='<div style="font-weight:bold;color:var(--primary);font-size:13px;margin-bottom:6px;">🎂 تولدهای امروز ('+tp(todayBdays.length)+' نفر)</div>';
  html+='<div style="display:grid;gap:6px;">';
  todayBdays.forEach(b=>{
    html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(135deg,#fef3c7 0%,#fef9e7 100%);border:1px solid #f59e0b;border-radius:8px;"><div style="font-size:20px;">🎂</div><div style="flex:1;"><div style="font-weight:bold;color:#92400e;font-size:13px;">${b.name}</div><div style="font-size:10px;color:#b45309;">${b.class&&b.class.length>2?'کلاس '+b.class:''} • تولد: ${b.birthDate}</div></div><button onclick="sendBirthdayWishes('${b.name.replace(/'/g,"\\'")}')" style="padding:4px 10px;background:#f59e0b;color:white;border:none;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit;">💌 تبریک</button></div>`;
  });
  html+='</div>';
  el.innerHTML=html;
}

    }catch(e){}
    const wishBody=`🎂 ${studentName} عزیز، تولدت مبارک! آرزو می‌کنیم سالی پر از موفقیت، شادی و سلامتی داشته باشی. 🌸\n— ${myName}`;

// ===== General announcements =====
function loadAnnouncements(){
  const sb=getSupabase();
  if(!sb){document.getElementById('ann-list').innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">آنلاین نیستید</div>';return;}
  sb.from('settings').select('key,value').then(({data,error})=>{
    if(error||!data){document.getElementById('ann-list').innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">داده‌ای یافت نشد</div>';return;}
    _announcementsCache=[];
    data.forEach(row=>{
      if(row.key&&row.key.indexOf('announcement_')===0){
        try{
          const ann=JSON.parse(row.value);
          if(ann&&ann.title)_announcementsCache.push(ann);
        }catch(e){}
      }
    });
    // Sort by createdAt desc
    _announcementsCache.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    renderAnnouncementsList();
  });
}
function renderAnnouncementsList(){
  const el=document.getElementById('ann-list');
  if(!el)return;
  if(_announcementsCache.length===0){
    el.innerHTML='<div style="text-align:center;color:var(--text-light);padding:12px;">هنوز اعلانی منتشر نشده</div>';
    return;
  }
  let html='<div style="display:grid;gap:8px;">';
  _announcementsCache.slice(0,20).forEach(a=>{
    const dateStr=a.createdAt?new Date(a.createdAt).toLocaleDateString('fa-IR'):'';
    const isAdmin=S.currentRole==='admin'||S.currentRole==='vice';
    html+=`<div style="padding:10px 12px;background:var(--hover);border-right:4px solid var(--primary);border-radius:8px;"><div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:4px;"><div style="font-weight:bold;color:var(--primary);">${a.title}</div><div style="display:flex;gap:4px;align-items:center;">${dateStr?'<span style="font-size:10px;color:var(--text-light);">'+dateStr+'</span>':''}${isAdmin?'<button onclick="deleteAnnouncement(\''+a.id+'\')" style="padding:2px 6px;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:4px;font-size:10px;cursor:pointer;">🗑️</button>':''}</div></div><div style="margin-top:6px;font-size:13px;line-height:1.6;">${a.body||''}</div>${a.authorName?'<div style="margin-top:4px;font-size:10px;color:var(--text-light);">👤 '+a.authorName+'</div>':''}</div>`;
  });
  html+='</div>';
  el.innerHTML=html;
}
async function createAnnouncement(){
  const title=document.getElementById('ann-title').value.trim();
  const body=document.getElementById('ann-body').value.trim();
  if(!title){showToast('عنوان لازم است');return;}
  if(!body){showToast('متن اعلان لازم است');return;}
  const sb=getSupabase();
  if(!sb){showToast('آنلاین نیستید');return;}
  const userId=localStorage.getItem('portal_user_id');
  let myName='مدیر';
  try{
    const uRes=await sb.from('users').select('name').eq('id',userId);
    if(uRes.data&&uRes.data.length>0)myName=uRes.data[0].name;
  }catch(e){}
  const annId='announcement_'+Date.now();
  const newAnn={id:annId,title,body,authorName:myName,createdAt:new Date().toISOString()};
  // Save as a settings row with key=announcement_<timestamp>
  try{
    // Use select+update if exists, otherwise insert (mini client doesn't support maybeSingle)
    const existing=await sb.from('settings').select('id').eq('key',annId);
    if(existing.data&&existing.data.length>0){
      await sb.from('settings').update({value:JSON.stringify(newAnn),updated_at:new Date().toISOString()}).eq('id',existing.data[0].id);
    }else{
      await sb.from('settings').insert({key:annId,value:JSON.stringify(newAnn),updated_at:new Date().toISOString()});
    }
    showToast('📢 اعلان منتشر شد');
    document.getElementById('ann-title').value='';
    document.getElementById('ann-body').value='';
    loadAnnouncements();
  }catch(e){showToast('❌ '+e.message);}
}
async function deleteAnnouncement(annId){
  if(!confirm('این اعلان حذف شود؟'))return;
  const sb=getSupabase();
  if(!sb)return;
  try{
    await sb.from('settings').delete().eq('key',annId);
    showToast('🗑️ حذف شد');
    loadAnnouncements();
  }catch(e){showToast('❌ '+e.message);}
}

function renderPwResetRequests(){

async function resetUserPasswordFromReq(reqId,username){
  if(!confirm('رمز «'+username+'» به 1234 ریست شود؟'))return;
  const sb=getSupabase();
  if(!sb)return;
  try{
    const{error}=await sb.from('users').update({password_hash:'1234',must_change_password:true}).eq('username',username);
    if(error)throw error;
    // Mark request as resolved
    const req=_pwResetRequestsCache.find(r=>r.id===reqId);
    if(req){
      req.status='resolved';
      req.reply='رمز به 1234 ریست شد. به کاربر اطلاع دهید.';
      await sb.from('settings').update({value:JSON.stringify(req),updated_at:new Date().toISOString()}).eq('key','pwreset_request_'+reqId);
    }
    showToast('✅ رمز ریست شد — کاربر می‌تواند با 1234 وارد شود');
    loadPwResetRequests();
  }catch(e){showToast('❌ '+e.message);}
}
async function replyToPwResetRequest(reqId){
  const reply=prompt('پاسخ به کاربر:');
  if(!reply)return;
  const sb=getSupabase();
  if(!sb)return;
  const req=_pwResetRequestsCache.find(r=>r.id===reqId);
  if(!req)return;
  req.reply=reply;
  req.status='resolved';
  try{
    await sb.from('settings').update({value:JSON.stringify(req),updated_at:new Date().toISOString()}).eq('key','pwreset_request_'+reqId);
    showToast('✅ پاسخ ثبت شد');
    loadPwResetRequests();
  }catch(e){showToast('❌ '+e.message);}
}
async function deletePwResetRequest(reqId){
  if(!confirm('این درخواست حذف شود؟'))return;
  const sb=getSupabase();
  if(!sb)return;
  try{
    await sb.from('settings').delete().eq('key','pwreset_request_'+reqId);
    showToast('🗑️ حذف شد');
    loadPwResetRequests();
  }catch(e){showToast('❌ '+e.message);}
}
// Create a forgot-password request (called from forgot password modal)
async function createPwResetRequest(username,note){
  const sb=getSupabase();
  if(!sb){showToast('ابتدا به اینترنت متصل شوید');return false;}
  const reqId='pwreset_request_'+Date.now();
  const req={id:reqId,username,note:note||'',requestedAt:new Date().toISOString(),status:'pending',reply:''};

}


// ====== STUDENT GROUPS (per-class, with goals & members) ======
// Each group: {id, name, goal, color, members:[studentName,...], createdAt}
// Stored in S.studentGroups[cls]=[{...}] and synced via settings table.

function renderStudentGroups(){
  const main=document.getElementById('view-groups');
  const cls=S.currentClass;
  if(!cls){main.innerHTML='<div class="settings-section"><p style="color:var(--text-light)">کلاسی انتخاب نشده</p></div>';return;}
  const students=getStudents();
  if(students.length===0){main.innerHTML='<div class="settings-section"><p style="color:var(--text-light)">دانش‌آموزی ثبت نشده</p></div>';return;}
  if(!S.studentGroups)S.studentGroups={};

  const groups=S.studentGroups[cls];
  let h='<div class="report-header"><div style="font-size:12px;opacity:0.8;">👥 گروه‌بندی دانش‌آموزان</div><div style="font-size:20px;font-weight:bold;margin-top:4px;">کلاس '+cls+' — '+tp(groups.length)+' گروه</div></div>';
  // ===== Create new group form =====
  h+='<div><div class="section-title">➕ تعریف گروه جدید</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;display:grid;gap:8px;">';
  h+='<div style="display:grid;grid-template-columns:2fr 3fr;gap:8px;">';
  h+='<div><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">نام گروه</label><input type="text" id="grp-name" placeholder="مثلاً: ستاره‌ها" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;box-sizing:border-box;"></div>';
  h+='<div><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">هدف گروه</label><input type="text" id="grp-goal" placeholder="مثلاً: میانگین ۹ در ریاضی این ماه" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;box-sizing:border-box;"></div>';
  h+='</div>';
  h+='<div><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">رنگ گروه</label><div id="grp-color-picker" style="display:flex;gap:6px;flex-wrap:wrap;">';
  const colorOpts=['#0F4C5C','#FF6B35','#2D8659','#D97706','#5F7A6B','#DC2626','#5BAFBF','#7E22CE','#0891B2','#9D174D'];
  colorOpts.forEach((c,i)=>{
    h+='<label style="cursor:pointer;"><input type="radio" name="grp-color" value="'+c+'" '+(i===0?'checked':'')+' style="display:none;"><span onclick="this.previousElementSibling.checked=true" style="display:inline-block;width:30px;height:30px;border-radius:50%;background:'+c+';border:2px solid white;box-shadow:0 0 0 1px '+c+';"></span></label>';
  });
  h+='</div></div>';
  h+='<button onclick="addStudentGroup()" class="add-btn" style="margin-top:0;">➕ افزودن گروه</button>';
  h+='</div></div>';
  // ===== Existing groups list =====
  h+='<div style="margin-top:16px;"><div class="section-title">📋 گروه‌های کلاس '+cls+' ('+tp(groups.length)+')</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;display:grid;gap:12px;">';
  if(groups.length===0){
    h+='<div style="text-align:center;color:var(--text-light);padding:20px;">هنوز گروهی ساخته نشده. فرم بالا را پر کنید و «افزودن گروه» بزنید.</div>';
  }else{
    groups.forEach((g,i)=>{
      // Compute group performance: average grade of members across all subjects/months
      let totalGrades=0,gradeCount=0,prCount=0,ndCount=0,posTotal=0,negTotal=0;
      g.members.forEach(name=>{
        (MS||[]).forEach(m=>{
          (SB||[]).forEach(sj=>{
            const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};
            Object.values(sd).forEach(sd_=>{
              const e=sd_[name];
              if(!e)return;
              const gr=e.grade?pf(e.grade):null;
              if(gr!==null){totalGrades+=gr;gradeCount++;}
              if(e.discipline==='عالی و تشویق')prCount++;
              if(ND&&ND.includes(e.discipline||''))ndCount++;
              if(e.positive)posTotal+=pf(e.positive);
              if(e.negative)negTotal+=pf(e.negative);
            });
          });
        });
      });
      const avg=gradeCount>0?(totalGrades/gradeCount).toFixed(2):'—';
      const avgColor=avg!=='—'?(pf(avg)>=8?'#16a34a':pf(avg)>=5?'#d97706':'#dc2626'):'';
      h+='<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;">';
      h+='<div style="background:'+g.color+';color:white;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><div><span style="font-weight:bold;font-size:15px;">'+g.name+'</span><span style="font-size:11px;opacity:0.9;margin-right:6px;"> — '+tp(g.members.length)+' نفر</span></div><div style="display:flex;gap:4px;"><button onclick="toggleGroupMembers('+i+')" style="padding:4px 10px;background:rgba(255,255,255,0.2);border:none;border-radius:4px;color:white;font-size:11px;cursor:pointer;font-family:inherit;">👥 اعضا</button><button onclick="editGroupName('+i+')" style="padding:4px 10px;background:rgba(255,255,255,0.2);border:none;border-radius:4px;color:white;font-size:11px;cursor:pointer;font-family:inherit;">✏️ ویرایش</button><button onclick="deleteStudentGroup('+i+')" style="padding:4px 10px;background:rgba(220,38,38,0.4);border:none;border-radius:4px;color:white;font-size:11px;cursor:pointer;font-family:inherit;">🗑️ حذف</button></div></div>';
      h+='<div style="padding:10px 14px;">';
      // Goal
      h+='<div style="margin-bottom:10px;padding:8px 10px;background:var(--hover);border-radius:6px;font-size:12px;"><span style="color:var(--text-light);">🎯 هدف گروه:</span> <b style="color:var(--primary);">'+(g.goal||'(بدون هدف)')+'</b></div>';
      // KPIs
      h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;">';
      h+='<div style="text-align:center;padding:6px;background:var(--hover);border-radius:6px;"><div style="font-size:10px;color:var(--text-light);">💯 میانگین</div><div style="font-weight:bold;color:'+avgColor+';">'+(typeof avg==='string'?avg:toPer(avg))+'</div></div>';
      h+='<div style="text-align:center;padding:6px;background:var(--hover);border-radius:6px;"><div style="font-size:10px;color:var(--text-light);">⭐ تشویق</div><div style="font-weight:bold;color:var(--success);">'+toPer(prCount)+'</div></div>';
      h+='<div style="text-align:center;padding:6px;background:var(--hover);border-radius:6px;"><div style="font-size:10px;color:var(--text-light);">➕ مثبت</div><div style="font-weight:bold;color:#16a34a;">'+toPer(String(posTotal))+'</div></div>';
      h+='<div style="text-align:center;padding:6px;background:var(--hover);border-radius:6px;"><div style="font-size:10px;color:var(--text-light);">➖ منفی</div><div style="font-weight:bold;color:#dc2626;">'+toPer(String(negTotal))+'</div></div>';
      h+='</div>';
      // Members (collapsible)
      h+='<div id="group-members-'+i+'" style="display:none;padding:8px;background:var(--hover);border-radius:6px;">';
      h+='<div style="font-size:11px;color:var(--text-light);margin-bottom:6px;font-weight:bold;">افزودن/حذف اعضا:</div>';
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;">';
      students.forEach(s=>{
        const sn=s.name||s;
        const inGroup=g.members.indexOf(sn)>=0;
        h+='<label style="display:flex;align-items:center;gap:4px;padding:4px 6px;background:'+(inGroup?g.color+'15':'transparent')+';border-radius:4px;cursor:pointer;"><input type="checkbox" '+(inGroup?'checked':'')+' onchange="toggleGroupMember('+i+',\''+sn.replace(/'/g,"\\'")+'\',this.checked)" style="width:14px;height:14px;"> '+sn+'</label>';
      });
      h+='</div></div>';
      h+='</div></div>';
    });
  }
  h+='</div></div>';
  main.innerHTML=h;
}
function addStudentGroup(){
  const name=document.getElementById('grp-name').value.trim();
  const goal=document.getElementById('grp-goal').value.trim();
  const colorEl=document.querySelector('input[name="grp-color"]:checked');
  const color=colorEl?colorEl.value:'#0F4C5C';
  if(!name){showToast('نام گروه لازم است');return;}
  const cls=S.currentClass;
  if(!S.studentGroups)S.studentGroups={};
  if(!S.studentGroups[cls])S.studentGroups[cls]=[];
  S.studentGroups[cls].push({
    id:'grp_'+Date.now(),
    name,goal,color,
    members:[],
    createdAt:new Date().toISOString()
  });
  saveS();
  syncStudentGroupsToDB(cls);
  renderStudentGroups();
  showToast('✅ گروه «'+name+'» ساخته شد');
}
function toggleGroupMember(groupIdx,studentName,isMember){
  const cls=S.currentClass;
  const g=S.studentGroups[cls][groupIdx];
  if(!g)return;
  if(isMember){
    if(g.members.indexOf(studentName)<0)g.members.push(studentName);
  }else{
    g.members=g.members.filter(n=>n!==studentName);
  }
  saveS();
  syncStudentGroupsToDB(cls);
  // Don't re-render — keep the panel open
}
function toggleGroupMembers(groupIdx){
  const el=document.getElementById('group-members-'+groupIdx);
  if(el){
    el.style.display=el.style.display==='none'?'block':'none';
  }
}
function editGroupName(groupIdx){
  const cls=S.currentClass;
  const g=S.studentGroups[cls][groupIdx];
  if(!g)return;
  const newName=prompt('نام جدید گروه:',g.name);
  if(newName===null)return;
  const newGoal=prompt('هدف جدید گروه:',g.goal||'');
  if(newGoal===null)return;
  g.name=newName.trim()||g.name;
  g.goal=newGoal.trim();
  saveS();
  syncStudentGroupsToDB(cls);
  renderStudentGroups();
}
function deleteStudentGroup(groupIdx){
  if(!confirm('گروه حذف شود؟ اعضای آن از گروه خارج می‌شوند.'))return;
  const cls=S.currentClass;
  S.studentGroups[cls].splice(groupIdx,1);

  syncStudentGroupsToDB(cls);
  renderStudentGroups();
  showToast('🗑️ گروه حذف شد');

// Sync groups to Supabase via settings table (no schema changes needed)
function syncStudentGroupsToDB(cls){
  if(!isOnline())return;
  const sb=getSupabase();
  if(!sb)return;
  const key='student_groups_'+cls;
  const value=JSON.stringify(S.studentGroups[cls]||[]);
  const now=new Date().toISOString();
  // Step 1: Try SELECT to see if the key already exists
  sb.from('settings').select('id').eq('key',key).limit(1).then(({data,error})=>{
    if(error){
      console.warn('Group select err:',error.message);
      return;
    }
    if(data&&data.length>0){
      // Row exists → UPDATE by id
      const rowId=data[0].id;
      sb.from('settings').update({value,updated_at:now}).eq('id',rowId).then(({error:e2})=>{
        if(e2)console.warn('Group update err:',e2.message);
      });
    }else{
      // Row doesn't exist → INSERT
      sb.from('settings').insert({key,value,updated_at:now}).then(({error:e3})=>{
        if(e3)console.warn('Group insert err:',e3.message);
      });
    }
  }).catch(e=>console.warn('Group sync err:',e.message));
}
// Load groups from DB on login (called from apiLoadState result merge)
function loadStudentGroupsFromSettings(){
  if(!isOnline())return;
  const sb=getSupabase();
  if(!sb)return;
  if(!S.studentGroups)S.studentGroups={};
  // Fetch all settings rows and filter on client side (mini Supabase client doesn't support ilike)
  sb.from('settings').select('key,value').then(({data,error})=>{
    if(error||!data)return;
    let loaded=0;
    data.forEach(row=>{
      if(row.key&&row.key.indexOf('student_groups_')===0){
        const cls=row.key.replace('student_groups_','');
        try{
          const parsed=JSON.parse(row.value);
          if(Array.isArray(parsed)){
            S.studentGroups[cls]=parsed;
            loaded++;
            // Also store under both Persian and Latin digit variants for resilience
            const norm=(s)=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
            // For lookup by both forms — try multiple variants
            const latin=cls.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
            const persian=cls.replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
            if(latin!==cls)S.studentGroups[latin]=parsed;
            if(persian!==cls)S.studentGroups[persian]=parsed;
          }
        }catch(e){
          console.warn('Bad group data for',cls,e.message);
        }
      }
    });
    if(loaded>0){
      saveS();
      // Re-render if we're on groups view
      const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
      if(activeView==='student-group'&&typeof renderStudentMyGroup==='function'){
        renderStudentMyGroup();
      }
      if(activeView==='groups'&&typeof renderStudentGroups==='function'){
        renderStudentGroups();
      }
    }
  }).catch(e=>console.log('Group load error:',e.message));
}
// Find which group a student belongs to (used by student portal)
function getMyGroup(studentName,cls){
  if(!S.studentGroups)return null;
  // Try multiple variants: exact, latin-digit, persian-digit
  const latin=String(cls||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const persian=String(cls||'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const variants=[cls,latin,persian].filter(v=>v);
  let groups=[];
  for(const v of variants){
    if(S.studentGroups[v]&&S.studentGroups[v].length>0){
      groups=S.studentGroups[v];
      break;
    }
  }
  for(const g of groups){
    if(g.members&&g.members.indexOf(studentName)>=0)return g;
  }
  return null;
}

let _quizQCount=0;
// Load pdf.js from CDN dynamically (only when needed)
let _pdfjsLoading=null;
function loadPdfJS(){
  if(typeof window.pdfjsLib!=='undefined')return Promise.resolve();
  if(_pdfjsLoading)return _pdfjsLoading;
  _pdfjsLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload=()=>{
      try{
        // Set worker URL — required for parsing
        if(window.pdfjsLib){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
      }catch(e){console.warn('pdf.js worker setup:',e.message);}
      res();
    };
    s.onerror=()=>{rej(new Error('بارگذاری کتابخانه PDF ناموفق بود'));};
    document.head.appendChild(s);
  });
  return _pdfjsLoading;
}

// Parse PDF and extract quiz questions. Format expected:
// 1. Question text?
// A) option 1
// B) option 2
// C) option 3
// D) option 4
// Answer: B  (or پاسخ: ب / Answer: B / Ans: C)
//
// Also supports Persian digits (۱. ۲. etc.) and Persian option markers (الف/ب/ج/د or ۱/۲/۳/۴).
async function importQuizFromPDF(){
  const input=document.getElementById('quiz-pdf-input');
  const statusEl=document.getElementById('pdf-import-status');
  if(!input||!input.files[0]){showToast('ابتدا فایل PDF را انتخاب کنید');return;}
  const file=input.files[0];
  if(file.size>10000000){showToast('⚠️ فایل PDF بزرگ است (حداکثر ۱۰MB)');return;}
  if(statusEl){
    statusEl.style.color='var(--primary)';
    statusEl.textContent='⏳ در حال بارگذاری کتابخانه PDF...';
  }
  try{
    await loadPdfJS();
    if(typeof window.pdfjsLib==='undefined'){
      throw new Error('کتابخانه PDF بارگذاری نشد');
    }
    if(statusEl){
      statusEl.textContent='⏳ در حال خواندن فایل PDF...';
    }
    // Read file as ArrayBuffer
    const buf=await file.arrayBuffer();
    // Load PDF
    const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    let fullText='';
    if(statusEl){
      statusEl.textContent='⏳ در حال استخراج متن از '+pdf.numPages+' صفحه...';
    }
    // Extract text from all pages
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      // Join items with spaces, preserve newlines where Y changes significantly
      let lastY=null;
      let pageText='';
      content.items.forEach(item=>{
        const y=item.transform[5];
        if(lastY!==null&&Math.abs(y-lastY)>2){
          pageText+='\n';
        }else if(pageText&&!pageText.endsWith(' ')&&!pageText.endsWith('\n')){
          pageText+=' ';
        }
        pageText+=item.str;
        lastY=y;
      });
      fullText+=pageText+'\n\n';
    }
    if(statusEl){
      statusEl.textContent='⏳ در حال تجزیه سوالات...';
    }
    // Parse questions from text
    const questions=parseQuizQuestions(fullText);
    if(questions.length===0){
      if(statusEl){
        statusEl.style.color='var(--danger)';
        statusEl.textContent='❌ هیچ سوال استانداردی در PDF پیدا نشد. فرمت PDF باید شامل سوال شماره‌دار + گزینه‌های A/B/C/D + خط پاسخ باشد.';
      }
      showToast('❌ سوال استاندارد پیدا نشد');
      return;
    }
    // Clear existing question form
    const container=document.getElementById('quiz-questions');
    if(container)container.innerHTML='';
    _quizQCount=0;
    // Add each parsed question to the form
    questions.forEach(q=>{
      addQuizQuestion();
      const qId='quiz-q-'+_quizQCount;
      const qText=document.querySelector('.quiz-q-text[data-q-id="'+qId+'"]');
      if(qText)qText.value=q.q;
      q.options.forEach((opt,i)=>{
        const optEl=document.querySelector('.quiz-opt[data-q-id="'+qId+'"][data-opt="'+i+'"]');
        if(optEl)optEl.value=opt;
      });
      const correctEl=document.querySelector('.quiz-correct[data-q-id="'+qId+'"]');
      if(correctEl)correctEl.value=q.correctIdx;
    });
    if(statusEl){
      statusEl.style.color='var(--success)';
      statusEl.textContent='✅ '+questions.length+' سوال از PDF استخراج شد و به فرم اضافه شد. کنترل کنید و کوییز را ذخیره کنید.';
    }
    showToast('✅ '+questions.length+' سوال استخراج شد');
  }catch(e){
    console.error('PDF import error:',e);
    if(statusEl){
      statusEl.style.color='var(--danger)';
      statusEl.textContent='❌ خطا: '+e.message;
    }
    showToast('❌ '+e.message);
  }
}
// Parse quiz questions from extracted text.
// Handles English and Persian numerals, A/B/C/D or 1/2/3/4 or الف/ب/ج/د option markers.
function parseQuizQuestions(text){
  if(!text)return [];
  // Normalize: convert Persian digits to Latin for parsing
  const toEn=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  let lines=text.split('\n').map(l=>l.trim());
  const questions=[];
  let i=0;
  // Patterns:
  // - Question: starts with "1." or "۱." or "Q1." or "Question 1:"
  // - Option: starts with "A)", "B)", "A.", "B.", "1)", "الف)", "الف."
  // - Answer: "Answer: B", "پاسخ: ب", "Ans: C", "Key: B"
  const qPattern=/^(\d+|[Qq]\d+|Question\s+\d+|سوال\s*\d+)\s*[.)\-:]?\s*(.+)$/;
  const optPattern=/^([A-Da-d]|الف|ب|ج|د|۱|۲|۳|۴|1|2|3|4)\s*[.)\-:]?\s*(.+)$/;
  const ansPattern=/^(Answer|Ans|پاسخ|Key|جواب|گزینه صحیح)\s*[:：]\s*([A-Da-d]|الف|ب|ج|د|۱|۲|۳|۴|1|2|3|4)/i;
  while(i<lines.length){
    const line=lines[i];
    if(!line){i++;continue;}
    const qMatch=line.match(qPattern);
    if(qMatch){
      // Start a new question
      const questionText=qMatch[2].trim();
      const options=[];
      let correctIdx=-1;
      let answerLine=null;
      // Skip the question line, scan forward for options and answer
      let j=i+1;
      while(j<lines.length){
        const sub=lines[j];
        if(!sub){j++;continue;}
        // Is this a new question? Stop scanning.
        if(sub.match(qPattern))break;
        const optMatch=sub.match(optPattern);
        const ansMatch=sub.match(ansPattern);
        if(ansMatch){
          // Found answer line — parse the option letter
          answerLine=ansMatch[2];
          j++;
          continue;
        }
        if(optMatch){
          // Found option — but skip if it looks like a question (e.g. "1. Question")
          // We already matched qPattern above so this is an option
          options.push(optMatch[2].trim());
          j++;
          continue;
        }
        // Otherwise it's just text (continuation of question or option)
        j++;
      }
      // Map answer to option index
      if(answerLine){
        // Convert answer letter to index: A/الف/۱/1 → 0, B/ب/۲/2 → 1, etc.
        const letterMap={
          'A':0,'a':0,'الف':0,'۱':0,'1':0,
          'B':1,'b':1,'ب':1,'۲':1,'2':1,
          'C':2,'c':2,'ج':2,'۳':2,'3':2,
          'D':3,'d':3,'د':3,'۴':3,'4':3
        };
        // Try Persian-letter or Latin-letter mapping
        const normalized=toEn(answerLine);
        if(letterMap[answerLine]!==undefined)correctIdx=letterMap[answerLine];
        else if(letterMap[normalized]!==undefined)correctIdx=letterMap[normalized];
        // If option index out of range, default to first
        if(correctIdx>=options.length)correctIdx=options.length-1;
      }
      // Only add if we have at least 2 options
      if(options.length>=2){
        questions.push({
          q:questionText,
          options:options,
          correctIdx:correctIdx>=0?correctIdx:0,
          score:1
        });
      }
      // Advance i to where we stopped
      i=j;
    }else{
      i++;
    }
  }
  return questions;
}

function saveQuiz(){
  const title=document.getElementById('quiz-title').value.trim();
  if(!title){showToast('عنوان لازم است');return;}
  const cls=getCurrentClassForRole();
  if(!cls){showToast('کلاسی مشخص نیست');return;}
  const questions=[];
  document.querySelectorAll('.quiz-q-text').forEach(textInput=>{
    const qId=textInput.dataset.qId;
    const qText=textInput.value.trim();
    if(!qText)return; // skip empty questions
    const opts=[];
    for(let i=0;i<4;i++){
      const optEl=document.querySelector('.quiz-opt[data-q-id="'+qId+'"][data-opt="'+i+'"]');
      if(optEl&&optEl.value.trim())opts.push(optEl.value.trim());
    }
    if(opts.length<2)return; // need at least 2 options
    const correctIdx=parseInt(document.querySelector('.quiz-correct[data-q-id="'+qId+'"]').value);
    const score=parseInt(document.querySelector('.quiz-score[data-q-id="'+qId+'"]').value)||1;
    questions.push({q:qText,options:opts,correctIdx:Math.min(correctIdx,opts.length-1),score});
  });
  if(questions.length===0){showToast('حداقل یک سوال لازم است');return;}
  if(!S.quizzes)S.quizzes={};
  if(!S.quizzes[cls])S.quizzes[cls]=[];
  S.quizzes[cls].push({
    id:'quiz_'+Date.now(),
    title,questions,
    active:false,
    responses:{},
    createdAt:new Date().toISOString()
  });
  saveS();
  syncQuizzesToDB(cls);
  // Reset form
  document.getElementById('quiz-title').value='';
  document.getElementById('quiz-questions').innerHTML='';
  _quizQCount=0;
  addQuizQuestion();
  renderQuiz();
  showToast('✅ کوییز ساخته شد. برای فعال‌سازی دکمه «▶️ فعال» را بزنید.');
}

function syncQuizzesToDB(cls){
  if(!isOnline())return;
  const sb=getSupabase();
  if(!sb)return;
  const key='quiz_'+cls;
  const value=JSON.stringify(S.quizzes[cls]||[]);
  const now=new Date().toISOString();
  sb.from('settings').select('id').eq('key',key).limit(1).then(({data,error})=>{
    if(error){console.warn('Quiz select err:',error.message);return;}
    if(data&&data.length>0){
      sb.from('settings').update({value,updated_at:now}).eq('id',data[0].id).then(({error:e2})=>{
        if(e2)console.warn('Quiz update err:',e2.message);
      });
    }else{
      sb.from('settings').insert({key,value,updated_at:now}).then(({error:e3})=>{
        if(e3)console.warn('Quiz insert err:',e3.message);
      });
    }
  }).catch(e=>console.warn('Quiz sync err:',e.message));
}
function loadQuizzesFromDB(){
  if(!isOnline())return;
  if(!S.quizzes)S.quizzes={};
  if(window._quizLoaded)return; // only once per session
  window._quizLoaded=true;
  const sb=getSupabase();
  if(!sb)return;
  sb.from('settings').select('key,value').then(({data,error})=>{
    if(error||!data)return;
    let loaded=0;
    data.forEach(row=>{
      if(row.key&&row.key.indexOf('quiz_')===0){
        const cls=row.key.replace('quiz_','');
        try{
          const parsed=JSON.parse(row.value);
          if(Array.isArray(parsed)){
            S.quizzes[cls]=parsed;
            // Also store under both Persian and Latin digit variants
            const latin=cls.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
            const persian=cls.replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
            if(latin!==cls)S.quizzes[latin]=parsed;
            if(persian!==cls)S.quizzes[persian]=parsed;
            loaded++;
          }
        }catch(e){}
      }
    });
    if(loaded>0){
      saveS();
      const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
      if(activeView==='quiz'&&typeof renderQuiz==='function')renderQuiz();
    }
  }).catch(e=>console.log('Quiz load error:',e.message));
}

// PDF export — shows a chooser then generates a beautiful single-page report card
function exportPDF(){
  const students=getStudents();
  if(students.length===0){showToast('دانش‌آموزی ثبت نشده');return;}
  const overlay=makeOverlay();
  const modal=makeModal();
  modal.style.maxWidth='420px';
  let html='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:40px;">📄</div><h3 style="color:var(--primary);margin-top:6px;font-size:18px;">چاپ کارنامه</h3><p style="font-size:12px;color:var(--text-light);margin-top:4px;">یک دانش‌آموز انتخاب کنید</p></div>';
  html+='<div style="display:grid;gap:6px;max-height:400px;overflow-y:auto;">';
  students.forEach(s=>{
    const name=s.name||s;
    const photo=S.classes[S.currentClass].photos?.[name];
    html+='<div onclick="printReportCard(\''+name.replace(/'/g,"\\'")+'\')" style="display:flex;gap:10px;align-items:center;padding:10px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background=\'var(--primary-light)\'" onmouseout="this.style.background=\'var(--card-bg)\'">'+(photo?'<img src="'+photo+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">':'<div style="width:36px;height:36px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--primary);">'+name.charAt(0)+'</div>')+'<span style="font-weight:bold;font-size:13px;">'+name+'</span></div>';
  });
  html+='</div>';
  html+='<button onclick="closeModal(document.querySelector(\'.overlay-active\'))" style="width:100%;padding:10px;background:var(--hover);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;margin-top:12px;font-size:13px;">↩ انصراف</button>';
  modal.innerHTML=html;
  overlay.appendChild(modal);
  overlay.classList.add('overlay-active');
  document.body.appendChild(overlay);
  escClose(overlay);
}

// ====== PROFESSIONAL SINGLE-PAGE REPORT CARD ======
function printReportCard(studentName){
  const cls=S.currentClass;
  const photo=S.classes[cls].photos?.[studentName];
  const initial=studentName.charAt(0);
  const student=getStudents().find(s=>(s.name||s)===studentName)||{name:studentName};
  const gradeScale=getGradeScale();
  const subjects=getSubjects();
  const hwOpts=getHomeworkOptions();
  const dcOpts=getDisciplineOptions();
  const role=getStudentRole(studentName);

  // Calculate per-subject averages
  let subjectAvgs=[];
  let totalGrades=[];
  MS.forEach(m=>{
    subjects.forEach(sj=>{
      let sg=[];
      const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};
      Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[studentName];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});
      const sa=sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0;
      const existing=subjectAvgs.find(x=>x.subject===sj);
      if(existing){existing.grades=existing.grades.concat(sg);existing.count+=sg.length;}
      else subjectAvgs.push({subject:sj,grades:sg,count:sg.length});
      totalGrades=totalGrades.concat(sg);
    });
  });
  subjectAvgs.forEach(s=>{s.avg=s.count>0?s.grades.reduce((a,b)=>a+b,0)/s.grades.length:0;});
  const overallAvg=totalGrades.length>0?totalGrades.reduce((a,b)=>a+b,0)/totalGrades.length:0;

  // Discipline/homework counts
  let praises=0,negDisc=0,negHw=0;
  MS.forEach(m=>{subjects.forEach(sj=>{
    const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};
    Object.values(sd).forEach(sd_=>{const e=sd_[studentName];if(!e)return;if(e.discipline==='عالی و تشویق')praises++;if(ND.includes(e.discipline||''))negDisc++;if(NH.includes(e.homework||''))negHw++;});
  });});

  // Streak
  let streak=0;
  for(let m=MS.length-1;m>=0;m--){
    const dates=gdm(MS[m]);
    for(let d=dates.length-1;d>=0;d--){
      const dc=getCell(cls,MS[m],S.currentSubject,dates[d],studentName,'discipline');
      if(dc==='عالی و تشویق')streak++;
      else if(dc)break;
    }
    if(streak>0)break;
  }

  // Rank
  const rankLabel=overallAvg>=gradeScale*0.9?'🎖️ سردار':overallAvg>=gradeScale*0.7?'🎖️ افسر':overallAvg>=gradeScale*0.5?'🎖️ سرباز':'🎬 تازه‌وارد';
  const quality=overallAvg>=gradeScale*0.9?'عالی':overallAvg>=gradeScale*0.7?'خوب':overallAvg>=gradeScale*0.5?'قابل قبول':'نیاز به تلاش';

  // Generate insights
  let insights=[];
  if(overallAvg>=gradeScale*0.9)insights.push('دانش‌آموز در سطح بسیار خوبی قرار دارد.');
  else if(overallAvg>=gradeScale*0.7)insights.push('دانش‌آموز پیشرفت قابل قبولی داشته است.');
  else if(overallAvg>0)insights.push('دانش‌آموز نیازمند تلاش بیشتر است.');
  if(praises>5)insights.push('تشویق‌های متعدد نشان‌دهنده رفتار مثبت است.');
  if(negDisc>3)insights.push('موارد انضباطی منفی نیاز به پیگیری دارد.');
  if(negHw>3)insights.push('تکالیف نامطلوب نیازمند توجه اولیا است.');
  let weakestSubj=null,weakestAvg=gradeScale;
  subjectAvgs.forEach(s=>{if(s.count>0&&s.avg<weakestAvg){weakestAvg=s.avg;weakestSubj=s.subject;}});
  if(weakestSubj)insights.push('در درس '+weakestSubj+' نیازمند تقویت است.');
  let strongestSubj=null,strongestAvg=0;
  subjectAvgs.forEach(s=>{if(s.count>0&&s.avg>strongestAvg){strongestAvg=s.avg;strongestSubj=s.subject;}});
  if(strongestSubj)insights.push('در درس '+strongestSubj+' عملکرد بسیار خوبی دارد.');

  // Detailed grades per month
  let monthlyAverages=MS.map(m=>{
    let sg=[];
    subjects.forEach(sj=>{
      const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};
      Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[studentName];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});
    });
    return {month:m,avg:sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0,count:sg.length};
  });

  // Build SVG charts
  // 1. Subject bar chart
  let barW=240;
  let barH=120;
  let svgBar='<svg width="100%" height="180" viewBox="0 0 300 180">';

  for(let i=0;i<=gradeScale;i+=Math.ceil(gradeScale/5)){

  });
  svgBar+='</svg>';

  // 2. Donut chart for discipline
  const total=praises+negDisc+negHw;
  let svgDonut='';
  if(total>0){
    svgDonut='<svg width="160" height="160" viewBox="0 0 160 160">';
    const cx=80,cy=80,r=60,rInner=35;
    let startAngle=-Math.PI/2;
    const slices=[
      {label:'تشویق',value:praises,color:'#2D8659'},

    slices.forEach(s=>{

      svgDonut+='<path d="M '+x1+' '+y1+' A '+r+' '+r+' 0 '+largeArc+' 1 '+x2+' '+y2+' L '+x1i+' '+y1i+' A '+rInner+' '+rInner+' 0 '+largeArc+' 0 '+x2i+' '+y2i+' Z" fill="'+s.color+'" stroke="white" stroke-width="2"/>';

  // 3. Monthly trend line

  svgLine+='<line x1="30" y1="10" x2="30" y2="100" stroke="#888" stroke-width="1"/>';

// AI analysis
function generateAIAnalysis(){
  const section=document.getElementById('ai-analysis-section');
  if(!section)return;
  const cls=S.currentClass;const students=getStudents();
  let grades=[],praises=0,negDisc=0,negHw=0;
  MS.forEach(m=>{SB.forEach(s=>{const sd=S.classes?.[cls]?.data?.[m]?.[s]||{};Object.entries(sd).forEach(([d,sd_])=>{Object.values(sd_).forEach(e=>{if(e.grade!==''&&e.grade!==undefined)grades.push(pf(e.grade));if(e.discipline==='عالی و تشویق')praises++;if(ND.includes(e.discipline||''))negDisc++;if(NH.includes(e.homework||''))negHw++;});});});});
  const avg=grades.length>0?(grades.reduce((a,b)=>a+b,0)/grades.length):0;
  // Generate insights based on data
  let insights=[];
  // Top student
  let topName='',topAvg=0;
  students.forEach(s=>{const name=s.name||s;let sg=[];MS.forEach(m=>{SB.forEach(sj=>{const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[name];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});});});const sa=sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0;if(sa>topAvg){topAvg=sa;topName=name;}});
  if(topName)insights.push({icon:'🌟',title:'برترین دانش‌آموز',text:topName+' با میانگین '+topAvg.toFixed(1)});
  // Subject performance
  let weakestSubject='',weakestAvg=10;
  SB.forEach(sj=>{let sg=[];MS.forEach(m=>{const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};Object.entries(sd).forEach(([d,sd_])=>{Object.values(sd_).forEach(e=>{if(e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});});});const sa=sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0;if(sg.length>0&&sa<weakestAvg){weakestAvg=sa;weakestSubject=sj;}});
  if(weakestSubject)insights.push({icon:'📚',title:'ضعیف‌ترین درس',text:weakestSubject+' با میانگین '+weakestAvg.toFixed(1)+' — نیاز به توجه بیشتر'});
  // Trend
  if(avg>=8)insights.push({icon:'📈',title:'وضعیت کلی',text:'کلاس وضعیت بسیار خوبی دارد. میانگین '+avg.toFixed(2)});
  else if(avg>=6)insights.push({icon:'📊',title:'وضعیت کلی',text:'کلاس قابل قبول است. میانگین '+avg.toFixed(2)});
  else if(avg>0)insights.push({icon:'📉',title:'وضعیت کلی',text:'نیاز به تلاش بیشتر. میانگین '+avg.toFixed(2)});
  // At-risk students
  let atRisk=[];
  students.forEach(s=>{const name=s.name||s;let sg=[];MS.forEach(m=>{SB.forEach(sj=>{const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[name];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});});});const sa=sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0;if(sa>0&&sa<5)atRisk.push({name,avg:sa});});
  if(atRisk.length>0)insights.push({icon:'⚠️',title:'دانش‌آموزان نیازمند توجه',text:atRisk.map(a=>a.name+' ('+a.avg.toFixed(1)+')').join('، ')});
  // Recommendations
  let recs=[];
  if(negDisc>5)recs.push('مداخله انضباطی — جلسه با اولیا');
  if(negHw>5)recs.push('پیگیری تکالیف — تماس با اولیا');
  if(avg<6)recs.push('برنامه آموزشی تقویتی');
  if(praises>20)recs.push('ادامه تشویق‌ها — سیاست مثبت');
  // Render
  let h='<div><div class="section-title">🤖 تحلیل هوشمند کلاس</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;">';
  h+='<div style="display:grid;gap:8px;">';
  insights.forEach(i=>{
    h+='<div style="display:flex;gap:8px;padding:10px;background:var(--primary-light);border-radius:8px;"><span style="font-size:24px;">'+i.icon+'</span><div><div style="font-weight:bold;font-size:13px;color:var(--primary);">'+i.title+'</div><div style="font-size:12px;margin-top:2px;">'+i.text+'</div></div></div>';
  });
  if(recs.length>0){
    h+='<div style="margin-top:8px;padding:12px;background:var(--warning-light);border-radius:8px;border:1px solid var(--warning);"><div style="font-weight:bold;color:var(--warning);font-size:13px;margin-bottom:6px;">💡 توصیه‌ها:</div><ul style="list-style:none;padding:0;">';
    recs.forEach(r=>{h+='<li style="padding:4px 0;font-size:12px;">✓ '+r+'</li>';});
    h+='</ul></div>';
  }
  h+='</div></div></div>';
  section.innerHTML=h;
  showToast('🤖 تحلیل انجام شد');
}

// ====== VOICE MEMO ======
function recordVoiceMemo(studentName){
  if(!navigator.mediaRecorder){
    showToast('⚠️ مرورگر شما از ضبط صوتی پشتیبانی نمی‌کند');
    return;
  }
  const cls=S.currentClass;
  const overlay=makeOverlay();
  const modal=makeModal();
  modal.style.maxWidth='380px';
  modal.innerHTML='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:36px;">🎙️</div><h3 style="color:var(--primary);margin-top:6px;font-size:16px;">یادداشت صوتی</h3><p style="font-size:12px;color:var(--text-light);margin-top:4px;">'+studentName+'</p></div>'+
    '<div id="voice-recorder" style="display:none;"><div class="voice-recorder"><div class="voice-btn recording" id="voice-stop">⏹</div><div id="voice-timer" style="font-weight:bold;font-size:14px;color:var(--danger);">۰:۰۰</div></div></div>'+
    '<div id="voice-player" style="display:none;"><audio id="voice-audio" controls style="width:100%;"></audio></div>'+
    '<div style="display:grid;gap:8px;margin-top:12px;">'+
    '<button id="voice-start" style="padding:12px;background:var(--danger);color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit;">🔴 شروع ضبط</button>'+
    '<button id="voice-save" style="padding:12px;background:var(--success);color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit;display:none;">💾 ذخیره</button>'+
    '<button id="voice-cancel" style="padding:10px;background:var(--hover);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;">انصراف</button></div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  escClose(overlay);
  document.getElementById('voice-cancel').onclick=()=>closeModal(overlay);
  let mediaRecorder,chunks=[],startTime,intervalId,audioBlob;
  document.getElementById('voice-start').onclick=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);
      chunks=[];
      mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      mediaRecorder.onstop=()=>{
        audioBlob=new Blob(chunks,{type:'audio/webm'});
        const url=URL.createObjectURL(audioBlob);
        document.getElementById('voice-audio').src=url;
        document.getElementById('voice-player').style.display='block';
        document.getElementById('voice-save').style.display='block';
        document.getElementById('voice-recorder').style.display='none';
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();
      startTime=Date.now();
      document.getElementById('voice-start').style.display='none';
      document.getElementById('voice-recorder').style.display='block';
      intervalId=setInterval(()=>{
        const elapsed=Math.floor((Date.now()-startTime)/1000);
        const m=Math.floor(elapsed/60),s=elapsed%60;
        document.getElementById('voice-timer').textContent=tp(m)+':'+tp(s);
      },1000);
    }catch(e){showToast('⚠️ خطا در دسترسی به میکروفون');}
  };
  document.getElementById('voice-stop').onclick=()=>{
    if(mediaRecorder&&mediaRecorder.state==='recording'){
      mediaRecorder.stop();
      clearInterval(intervalId);
    }
  };
  document.getElementById('voice-save').onclick=()=>{
    if(!audioBlob)return;
    if(audioBlob.size>500000){showToast('⚠️ فایل صوتی بزرگ است (حداکثر ۵۰۰KB)');return;}
    const r=new FileReader();
    r.onload=()=>{
      if(!S.classes[cls].voiceMemos)S.classes[cls].voiceMemos={};
      if(!S.classes[cls].voiceMemos[studentName])S.classes[cls].voiceMemos[studentName]=[];
      S.classes[cls].voiceMemos[studentName].push({data:r.result,date:new Date().toLocaleString('fa-IR')});
      saveS();
      closeModal(overlay);
      showToast('✅ یادداشت صوتی ذخیره شد');
    };
    r.readAsDataURL(audioBlob);
  };
}

  const oldClass=S.currentClass;
  S.currentClass=childInfo.classCode;
  loadAssignments('student');

// Get the parent's child (find by parent's childName or displayName)
function getMyChild(){
  const u=getCurrentUser();
  if(!u)return null;
  // Try to find child by parent's childName field
  const childName=u.childName||(u.displayName?u.displayName.replace('ولی ','').replace('ولی‌',''):'');
  if(childName){
    // Search in currentClass first, then all classes
    const searchClasses=S.currentClass&&S.classes[S.currentClass]?[S.currentClass]:Object.keys(S.classes);
    for(const cls of searchClasses){
      const students=S.classes[cls].students;
      const found=students.find(s=>(s.name||s)===childName);
      if(found)return {student:found,classCode:cls};
      // Also try partial match
      const partial=students.find(s=>{const sn=(s.name||s).trim();return sn.includes(childName)||childName.includes(sn);});
      if(partial)return {student:partial,classCode:cls};
    }
  }
  // Fallback: return first student from first class (shouldn't happen normally)
  const classes=Object.keys(S.classes);
  for(const cls of classes){
    const students=S.classes[cls].students;
    if(students.length>0)return {student:students[0],classCode:cls};
  }
  return null;
}

  const {student:child,classCode:cls}=childInfo;
  const photo=S.classes[cls].photos?.[child.name];
  const initial=child.name.charAt(0);
  const subjects=getSubjects();
  const gradeScale=getGradeScale();
  const role=getStudentRole(child.name);
  // Calculate averages
  let totalGrades=[],subjectAvgs=[];
  subjects.forEach(sj=>{
    let sg=[];
    MS.forEach(m=>{
      const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};
      Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[child.name];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});
    });
    const sa=sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0;
    subjectAvgs.push({subject:sj,avg:sa,count:sg.length});
    totalGrades=totalGrades.concat(sg);
  });
  const overallAvg=totalGrades.length>0?totalGrades.reduce((a,b)=>a+b,0)/totalGrades.length:0;
  let praises=0,negDisc=0,negHw=0;
  MS.forEach(m=>{subjects.forEach(sj=>{const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};Object.values(sd).forEach(sd_=>{const e=sd_[child.name];if(!e)return;if(e.discipline==='عالی و تشویق')praises++;if(ND.includes(e.discipline||''))negDisc++;if(NH.includes(e.homework||''))negHw++;});});});
  let streak=0;
  for(let m=MS.length-1;m>=0;m--){const dates=gdm(MS[m]);for(let d=dates.length-1;d>=0;d--){const dc=getCell(cls,MS[m],S.currentSubject,dates[d],child.name,'discipline');if(dc==='عالی و تشویق')streak++;else if(dc)break;}if(streak>0)break;}
  const rankLabel=overallAvg>=gradeScale*0.9?'🎖️ سردار':overallAvg>=gradeScale*0.7?'🎖️ افسر':overallAvg>=gradeScale*0.5?'🎖️ سرباز':'🎬 تازه‌وارد';
  const quality=overallAvg>=gradeScale*0.9?'عالی':overallAvg>=gradeScale*0.7?'خوب':overallAvg>=gradeScale*0.5?'قابل قبول':'نیاز به تلاش';
  // Insights
  let insights=[];
  if(overallAvg>=gradeScale*0.9)insights.push('🌟 فرزند شما در سطح بسیار خوبی قرار دارد.');
  else if(overallAvg>=gradeScale*0.7)insights.push('✅ فرزند شما پیشرفت قابل قبولی داشته است.');
  else if(overallAvg>0)insights.push('⚠️ فرزند شما نیازمند تلاش بیشتر است.');
  if(praises>0)insights.push('⭐ فرزند شما '+tp(praises)+' بار تشویق شده است.');
  if(negDisc>0)insights.push('⚠️ '+tp(negDisc)+' مورد انضباطی منفی ثبت شده است.');
  if(negHw>0)insights.push('📚 '+tp(negHw)+' تکلیف نامطلوب داشته است.');
  if(streak>0)insights.push('🔥 استریک تشویق: '+tp(streak)+' روز متوالی');
  let weakest=null,strongest=null;
  subjectAvgs.forEach(s=>{if(s.count>0){if(!strongest||s.avg>strongest.avg)strongest=s;if(!weakest||s.avg<weakest.avg)weakest=s;}});
  if(strongest)insights.push('💪 قوی‌ترین درس: '+strongest.subject+' ('+toPer(strongest.avg.toFixed(1))+')');
  if(weakest&&weakest.avg<gradeScale*0.6)insights.push('📚 نیازمند تقویت: '+weakest.subject+' ('+toPer(weakest.avg.toFixed(1))+')');

  let h='<div class="report-header"><div style="font-size:12px;opacity:0.8;">👨‍👩‍👧 پنل اولیا — خلاصه وضعیت فرزند</div><div style="font-size:20px;font-weight:bold;margin-top:4px;">'+S.schoolName+' — سال <span dir="ltr">'+S.yearName+'</span></div></div>';

  // Subject averages
  h+='<div style="margin-top:16px;"><div class="section-title">📊 میانگین به تفکیک درس</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;">';

  // Insights
