async function uploadProfilePhoto(){
  const i=document.createElement('input');
  i.type='file';
  i.accept='image/*';
  // Must be in DOM for some browsers
  i.style.display='none';
  document.body.appendChild(i);
  i.onchange=async e=>{
    const f=e.target.files[0];
    if(!f){document.body.removeChild(i);return;}
    if(f.size>2000000){showToast('⚠️ عکس بزرگ است (حداکثر ۲ مگابایت)');document.body.removeChild(i);return;}
    const reader=new FileReader();
    reader.onload=async ev=>{
      const photoData=ev.target.result;
      // Save to localStorage
      localStorage.setItem('profile_photo_'+(localStorage.getItem('portal_user_id')||''),photoData);
      // Try to save to DB if profile_photo column exists
      try{
        const sb=getSupabase();
        const userId=localStorage.getItem('portal_user_id');
        if(sb&&userId){
          const r=await sb.from('users').update({profile_photo:photoData}).eq('id',userId);
        }
      }catch(e){console.log('Could not save to DB:',e.message);}
      // Update UI - find ALL photo elements and update them
      document.querySelectorAll('#student-profile-photo, [id*="profile-photo"]').forEach(el=>{
        if(el.tagName==='IMG')el.src=photoData;
      });
      // Also re-render the current view to show the new photo
      const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
      if(activeView && activeView.includes('overview')){
        // Re-render student overview
        if(typeof renderStudentOverview==='function')renderStudentOverview();
      }
      showToast('✅ عکس پروفایل ذخیره شد');
      // Clean up input element
      i.value='';  // Reset so same file can be selected again
      setTimeout(()=>{if(i.parentNode)i.parentNode.removeChild(i);},100);
    };
    reader.readAsDataURL(f);
  };
  // Reset value to allow re-selecting the same file
  i.value='';
  i.click();
}

// Remove profile photo
function removeProfilePhoto(){
  if(!confirm('عکس پروفایل حذف شود؟'))return;
  const userId=localStorage.getItem('portal_user_id')||'';
  localStorage.removeItem('profile_photo_'+userId);
  // Try to remove from DB
  try{
    const sb=getSupabase();
    if(sb&&userId){
      sb.from('users').update({profile_photo:null}).eq('id',userId);
    }
  }catch(e){}
  // Re-render
  const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
  if(activeView && activeView.includes('overview')){
    if(typeof renderStudentOverview==='function')renderStudentOverview();
  }
  showToast('🗑️ عکس حذف شد');
}

// Get profile photo (from localStorage or DB)
function getProfilePhoto(){
  const userId=localStorage.getItem('portal_user_id')||'';
  return localStorage.getItem('profile_photo_'+userId)||null;
}

// ====== VOICE RECORDING ======
let _mediaRecorder=null;
let _voiceChunks=[];
let _voiceTimer=null;
let _voiceStartTime=0;
let _voiceMimeUsed='audio/webm'; // Track actual MIME used by MediaRecorder

// Pick a MediaRecorder MIME that this device/browser can actually encode AND play back.
// iOS Safari can't decode audio/webm (only encodes as audio/mp4), so prefer mp4 on iOS.
function pickSupportedVoiceMime(){
  const candidates=[
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/mpeg',
    'audio/webm;codecs=opus',
    'audio/webm'
  ];
  if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported){
    return 'audio/webm'; // graceful fallback
  }
  for(const t of candidates){
    try{ if(MediaRecorder.isTypeSupported(t)) return t; }catch(e){}
  }
  return 'audio/webm';
}

// Map a MIME type to a file extension used for storage / download
function mimeToFileExt(mime){
  if(!mime)return 'webm';
  if(mime.indexOf('mp4')>=0||mime.indexOf('mpeg')>=0||mime.indexOf('aac')>=0) return 'mp3';
  if(mime.indexOf('ogg')>=0) return 'ogg';
  return 'webm';
}

function startVoiceRecord(areaId,contextId,isFeedback){
  const area=document.getElementById(areaId);
  if(!area)return;
  area.innerHTML='<div style="text-align:center;padding:12px;background:var(--danger-light);border:1px solid var(--danger);border-radius:8px;"><div style="font-size:24px;">🔴</div><div id="voice-timer" style="font-size:14px;color:var(--danger);font-weight:bold;">۰۰:۰۰</div><button onclick="stopVoiceRecord(\''+areaId+'\','+contextId+','+(isFeedback?'true':'false')+')" style="margin-top:8px;padding:8px 16px;background:var(--danger);color:white;border:none;border-radius:6px;cursor:pointer;font-family:inherit;">⏹ توقف و ذخیره</button><button onclick="cancelVoiceRecord(\''+areaId+'\','+contextId+','+(isFeedback?'true':'false')+')" style="margin-top:8px;padding:8px 16px;background:var(--hover);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:inherit;margin-right:4px;">انصراف</button></div>';
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const mime=pickSupportedVoiceMime();
    _voiceMimeUsed=mime;
    try{
      _mediaRecorder=new MediaRecorder(stream,{mimeType:mime});
    }catch(e){
      _mediaRecorder=new MediaRecorder(stream);
    }
    _voiceChunks=[];
    _mediaRecorder.ondataavailable=e=>{if(e.data.size>0)_voiceChunks.push(e.data);};
    _mediaRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      // Use the actual MIME the recorder used (fall back to detected value)
      const actualMime=(_mediaRecorder.mimeType)||mime;
      const blob=new Blob(_voiceChunks,{type:actualMime});
      if(blob.size>2000000){showToast('⚠️ فایل صوتی بزرگ است (حداکثر ۲MB)');return;}
      const reader=new FileReader();
      reader.onload=()=>{
        const dataUrl=reader.result;
        if(isFeedback){
          localStorage.setItem('voice_feedback_'+contextId,dataUrl);
          area.innerHTML='<div style="display:flex;align-items:center;gap:6px;"><audio controls src="'+dataUrl+'" style="height:30px;flex:1;"></audio><button onclick="localStorage.removeItem(\'voice_feedback_'+contextId+'\');startVoiceRecord(\''+areaId+'\','+contextId+',true);showToast(\'🗑️ حذف شد\')" style="padding:4px 8px;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:4px;font-size:11px;cursor:pointer;">🗑️</button></div><p style="font-size:10px;color:var(--success);margin-top:4px;">✅ بازخورد صوتی ضبط شد</p>';
        }else{
          localStorage.setItem('voice_msg_'+contextId,dataUrl);
          area.innerHTML='<div style="display:flex;align-items:center;gap:6px;"><audio controls src="'+dataUrl+'" style="height:30px;flex:1;"></audio><button onclick="localStorage.removeItem(\'voice_msg_'+contextId+'\');startVoiceRecord(\''+areaId+'\','+contextId+',false);showToast(\'🗑️ حذف شد\')" style="padding:4px 8px;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:4px;font-size:11px;cursor:pointer;">🗑️</button></div><p style="font-size:10px;color:var(--success);margin-top:4px;">✅ پیام صوتی ضبط شد</p>';
        }
        showToast('✅ صوت ذخیره شد');
      };
      reader.readAsDataURL(blob);
    };
    _mediaRecorder.start();
    _voiceStartTime=Date.now();
    _voiceTimer=setInterval(()=>{
      const el=document.getElementById('voice-timer');
      if(el){
        const s=Math.floor((Date.now()-_voiceStartTime)/1000);
        el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
      }
    },1000);
  }).catch(e=>{
    showToast('⚠️ دسترسی به میکروفون ممکن نیست: '+e.message);
    if(isFeedback){
      area.innerHTML='<button id="voice-record-btn" onclick="startVoiceRecord(\''+areaId+'\','+contextId+',true)" style="padding:10px;background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">🎤 ضبط بازخورد صوتی</button>';
    }else{
      area.innerHTML='<button id="voice-record-btn" onclick="startVoiceRecord(\''+areaId+'\','+contextId+',false)" style="padding:10px;background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">🎤 ضبط پیام صوتی</button>';
    }
  });
}

function stopVoiceRecord(areaId,contextId,isFeedback){
  if(_voiceTimer)clearInterval(_voiceTimer);
  if(_mediaRecorder&&_mediaRecorder.state==='recording'){
    _mediaRecorder.stop();
  }
}

function cancelVoiceRecord(areaId,contextId,isFeedback){
  if(_voiceTimer)clearInterval(_voiceTimer);
  if(_mediaRecorder&&_mediaRecorder.state==='recording'){
    _mediaRecorder.stop();
  }
  const area=document.getElementById(areaId);
  if(area){
    if(isFeedback){
      area.innerHTML='<button id="voice-record-btn" onclick="startVoiceRecord(\''+areaId+'\','+contextId+',true)" style="padding:10px;background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">🎤 ضبط بازخورد صوتی</button>';
    }else{
      area.innerHTML='<button id="voice-record-btn" onclick="startVoiceRecord(\''+areaId+'\','+contextId+',false)" style="padding:10px;background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">🎤 ضبط پیام صوتی</button>';
    }
  }
}

function clearVoiceFeedback(submissionId){
  localStorage.removeItem('voice_feedback_'+submissionId);
  const area=document.getElementById('voice-feedback-area');

    area.innerHTML='<button onclick="startVoiceRecord(\'voice-feedback-area\','+submissionId+',true)" style="padding:10px;background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">🎤 ضبط بازخورد صوتی</button>';
  }
  showToast('🗑️ صوت حذف شد');
}

function switchStudentView(v){
  const main=document.getElementById('main');
  main.innerHTML='';
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  const tab=document.querySelector(`[data-view="${v}"]`);if(tab)tab.classList.add('active');
  // Create the view div FIRST (needed for all views including student-delegate)
  const div=document.createElement('div');div.className='view active';div.id='view-'+v;main.appendChild(div);
  // Now render the view content
  if(v==='student-overview')renderStudentOverview();
  if(v==='student-reports')renderStudentReports();
  if(v==='student-group')renderStudentMyGroup();
  if(v==='student-quiz')renderQuiz();
  if(v==='student-announcements')renderAnnouncements();
  if(v==='student-grades')renderStudentGrades();
  if(v==='student-attendance')renderStudentAttendance();
  if(v==='student-homework')renderStudentHomework();
  if(v==='student-messages')renderMessages('student');
  if(v==='student-delegate')renderStudentDelegate();
  if(v==='student-settings')renderStudentSettings();
}

function getMyStudentData(){
  // For student, find their own record by matching name (and currentClass if available)
  const u=getCurrentUser();
  if(!u)return null;
  const myName=u.displayName||u.name||u.username||'';
  if(!myName)return null;
  // Helper: normalize Persian/Arabic chars for robust matching
  // (handles ی vs ي, ک vs ك,zero-width non-joiners, multiple spaces)
  const norm=(s)=>String(s||'')
    .replace(/\u200c/g,'') // remove ZWNJ
    .replace(/\u0643/g,'\u06a9') // ك → ک (Arabic Kaf → Persian Keheh)
    .replace(/\u064a/g,'\u06cc') // ي → ی (Arabic Yeh → Persian Yeh)
    .replace(/\s+/g,' ')
    .trim();
  // For students, currentClass is their class
  // Look in currentClass first (faster), then all classes
  const searchClasses=S.currentClass&&S.classes[S.currentClass]?[S.currentClass]:Object.keys(S.classes);
  for(const cls of searchClasses){
    if(!S.classes[cls]||!S.classes[cls].students)continue;
    const students=S.classes[cls].students;
    // Match by name OR by partial match (in case of slight variation)
    let found=students.find(s=>norm(s.name||s)===norm(myName));
    if(!found){
      // Try with trimmed names
      found=students.find(s=>{
        return norm(s.name||s)===norm(myName);
      });
    }
    if(!found){
      // Try partial match (includes) — using normalized names
      found=students.find(s=>{
        const sn=norm(s.name||s);
        const un=norm(myName);
        return sn.includes(un)||un.includes(sn);
      });
    }
    if(!found){
      // Try matching last 2 words (in case of title differences)
      const myWords=norm(myName).split(' ');
      if(myWords.length>=2){
        const myLast=myWords.slice(-2).join(' ');
        found=students.find(s=>{
          const sn=norm(s.name||s);
          const snWords=sn.split(' ');
          if(snWords.length>=2){
            const snLast=snWords.slice(-2).join(' ');
            return snLast===myLast;
          }
          return false;
        });
      }
    }
    if(found)return {student:found,classCode:cls};
  }
  return null;
}

// ====== STUDENT REPORTS (Daily / Weekly / Monthly / Term) ======
let _studentReportSubTab='daily';
function renderStudentReports(){
  const main=document.getElementById('view-student-reports');
  if(!main)return;
  const data=getMyStudentData();
  if(!data){
    main.innerHTML='<div class="settings-section" style="text-align:center;padding:40px;"><div style="font-size:48px;margin-bottom:12px;">📭</div><p style="color:var(--text-light);font-size:14px;">اطلاعات شما یافت نشد</p><p style="font-size:11px;color:var(--text-light);margin-top:8px;">با آموزگار خود تماس بگیرید</p><button onclick="refreshData()" class="add-btn" style="margin-top:12px;">🔄 بارگذاری مجدد</button></div>';
    return;
  }
  const{student,classCode}=data;
  const cls=classCode;
  // Sub-tab bar
  const subTabs=[
    {id:'daily',icon:'📅',label:'روزانه'},
    {id:'weekly',icon:'🗓️',label:'هفتگی'},
    {id:'monthly',icon:'📆',label:'ماهانه'},
    {id:'term',icon:'🎓',label:'کارنامه ترم'}
  ];
  let h='<div class="report-header"><div style="font-size:12px;opacity:0.8;">📊 گزارش‌های تحصیلی</div><div style="font-size:20px;font-weight:bold;margin-top:4px;">'+student.name+' — کلاس '+cls+'</div></div>';
  h+='<div style="display:flex;gap:4px;padding:8px;background:var(--hover);border-radius:8px;overflow-x:auto;flex-wrap:nowrap;margin-bottom:12px;">';
  subTabs.forEach(t=>{
    const active=_studentReportSubTab===t.id;
    h+='<button onclick="_setReportSubTab(\''+t.id+'\')" style="padding:8px 14px;border:2px solid '+(active?'var(--primary)':'transparent')+';background:'+(active?'var(--primary)':'var(--card-bg)')+';color:'+(active?'white':'var(--text)')+';border-radius:18px;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;">'+t.icon+' '+t.label+'</button>';
  });
  h+='</div>';
  if(_studentReportSubTab==='daily'){
    h+=_renderStudentDailyReport(student,cls);
  }else if(_studentReportSubTab==='weekly'){
    h+=_renderStudentWeeklyReport(student,cls);
  }else if(_studentReportSubTab==='monthly'){
    h+=_renderStudentMonthlyReport(student,cls);
  }else if(_studentReportSubTab==='term'){
    h+=_renderStudentTermReport(student,cls);
  }
  main.innerHTML=h;
}
function _setReportSubTab(t){
  _studentReportSubTab=t;

function renderStudentOverviewWithData(main,child,cls){
  const photo=S.classes[cls].photos?.[child.name];
  const initial=child.name.charAt(0);
  const subjects=getSubjects();
  const gradeScale=getGradeScale();
  const role=getStudentRole(child.name);
  let totalGrades=[],subjectAvgs=[];
  subjects.forEach(sj=>{
    let sg=[];
    MS.forEach(m=>{
      const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};
      Object.entries(sd).forEach(([d,sd_])=>{const e=sd_[child.name];if(e&&e.grade!==''&&e.grade!==undefined)sg.push(pf(e.grade));});
    });
    const sa=sg.length>0?sg.reduce((a,b)=>a+b,0)/sg.length:0;
    subjectAvgs.push({subject:sj,avg:sa,count:sg.length});
    totalGrades=totalGrades.concat(sg);
  });
  const overallAvg=totalGrades.length>0?totalGrades.reduce((a,b)=>a+b,0)/totalGrades.length:0;
  let praises=0,negDisc=0,negHw=0;
  MS.forEach(m=>{subjects.forEach(sj=>{const sd=S.classes?.[cls]?.data?.[m]?.[sj]||{};Object.values(sd).forEach(sd_=>{const e=sd_[child.name];if(!e)return;if(e.discipline==='عالی و تشویق')praises++;if(ND.includes(e.discipline||''))negDisc++;if(NH.includes(e.homework||''))negHw++;});});});
  let streak=0;
  for(let m=MS.length-1;m>=0;m--){const dates=gdm(MS[m]);for(let d=dates.length-1;d>=0;d--){const dc=getCell(cls,MS[m],S.currentSubject,dates[d],child.name,'discipline');if(dc==='عالی و تشویق')streak++;else if(dc)break;}if(streak>0)break;}
  const rankLabel=overallAvg>=gradeScale*0.9?'🎖️ سردار':overallAvg>=gradeScale*0.7?'🎖️ افسر':overallAvg>=gradeScale*0.5?'🎖️ سرباز':'🎬 تازه‌وارد';
  const quality=overallAvg>=gradeScale*0.9?'عالی':overallAvg>=gradeScale*0.7?'خوب':overallAvg>=gradeScale*0.5?'قابل قبول':'نیاز به تلاش';

  // Profile photo display
  const profilePhoto=getProfilePhoto();
  const photoHtml=profilePhoto?`<div style="text-align:center;margin:16px 0;"><img id="student-profile-photo" src="${profilePhoto}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);" /><div style="margin-top:8px;display:flex;gap:6px;justify-content:center;"><button onclick="uploadProfilePhoto()" style="padding:6px 12px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;">📷 تغییر عکس</button><button onclick="removeProfilePhoto()" style="padding:6px 12px;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;">🗑️ حذف</button></div></div>`:`<div style="text-align:center;margin:16px 0;"><div style="width:80px;height:80px;border-radius:50%;background:var(--hover);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:32px;">👤</div><button onclick="uploadProfilePhoto()" style="margin-top:8px;padding:6px 12px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;">📷 آپلود عکس پروفایل</button></div>`;
  h=photoHtml+'<div class="report-header"><div style="font-size:12px;opacity:0.8;">🎓 پنل دانش‌آموز — وضعیت تحصیلی</div><div style="font-size:20px;font-weight:bold;margin-top:4px;">'+S.schoolName+' — سال <span dir="ltr">'+S.yearName+'</span></div></div>';
  h+=`<div style="background:linear-gradient(135deg,var(--primary) 0%,#0a3540 100%);color:white;padding:24px;border-radius:16px;margin:16px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap;">`;
  h+=`<div style="width:100px;height:100px;border-radius:50%;overflow:hidden;border:4px solid white;flex-shrink:0;">${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover;">`:`<div style="width:100%;height:100%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold;">${initial}</div>`}</div>`;
  h+=`<div style="flex:1;min-width:200px;"><div style="font-size:20px;font-weight:bold;">${child.name}</div><div style="font-size:13px;opacity:0.9;margin-top:4px;">کلاس ${cls} — آموزگار: ${S.classes[cls].teacher||'—'}</div>`;
  if(role)h+=`<div style="display:inline-block;margin-top:8px;background:rgba(255,255,255,0.2);padding:4px 12px;border-radius:14px;font-size:12px;font-weight:bold;">🎖️ ${role}</div>`;
  h+=`</div><div style="text-align:center;"><div style="font-size:10px;opacity:0.8;">میانگین کلی</div><div style="font-size:42px;font-weight:900;">${overallAvg>0?toPer(overallAvg.toFixed(1)):'—'}</div><div style="font-size:11px;opacity:0.8;">از ${toPer(gradeScale)}</div><div style="margin-top:4px;font-weight:bold;">${rankLabel} • ${quality}</div></div></div>`;
  h+='<div class="kpi-grid"><div class="kpi-card" style="border-top-color:var(--success)"><div class="kpi-label" style="background:var(--success-light)">⭐ تشویق‌ها</div><div class="kpi-value" style="color:var(--success)">'+tp(praises)+'</div></div><div class="kpi-card" style="border-top-color:var(--accent)"><div class="kpi-label" style="background:var(--accent-light)">🔥 استریک</div><div class="kpi-value" style="color:var(--accent)">'+tp(streak)+'</div></div><div class="kpi-card" style="border-top-color:var(--danger)"><div class="kpi-label" style="background:var(--danger-light)">⚠️ انضباط منفی</div><div class="kpi-value" style="color:var(--danger)">'+tp(negDisc)+'</div></div><div class="kpi-card" style="border-top-color:var(--warning)"><div class="kpi-label" style="background:var(--warning-light)">📚 تکلیف نامطلوب</div><div class="kpi-value" style="color:var(--warning)">'+tp(negHw)+'</div></div></div>';
  h+='<div style="margin-top:16px;"><div class="section-title">📊 میانگین به تفکیک درس</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;">';
  subjectAvgs.forEach(s=>{
    const pct=s.avg/gradeScale*100;
    const qColor=s.avg>=gradeScale*0.9?'var(--success)':s.avg>=gradeScale*0.7?'var(--primary)':s.avg>=gradeScale*0.5?'var(--warning)':'var(--danger)';
    h+=`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-weight:bold;">📚 ${s.subject}</span><span style="color:${qColor};font-weight:bold;">${s.count>0?toPer(s.avg.toFixed(1)):'—'} / ${toPer(gradeScale)}</span></div><div class="goal-progress"><div class="goal-progress-fill" style="width:${pct}%;background:${qColor};"></div></div></div>`;
  });
  h+='</div></div>';
  // ====== Show student's goals (set by teacher) ======
  const myGoals=(S.goals?.[cls]||[]).filter(g=>g.student===child.name||!g.student);
  h+='<div style="margin-top:16px;"><div class="section-title">🎯 اهداف من ('+tp(myGoals.length)+')</div><div style="background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;">';
  if(myGoals.length===0){
    h+='<div style="text-align:center;color:var(--text-light);padding:12px;">هنوز هدف‌گذاری نشده. آموزگار می‌تواند برای شما هدف تعریف کند.</div>';
  }else{
    myGoals.forEach(g=>{
      const pct=g.target>0?Math.min(100,(g.current/g.target)*100):0;
      h+='<div class="goal-item"><div style="display:flex;justify-content:space-between;align-items:start;gap:8px;"><div style="flex:1;"><div style="font-weight:bold;font-size:14px;">'+g.title+'</div>'+(g.student?'<div style="font-size:11px;color:var(--text-light);margin-top:2px;">👤 '+g.student+'</div>':'')+'</div></div><div class="goal-progress"><div class="goal-progress-fill" style="width:'+pct+'%;"></div></div><div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;"><span>'+tp(g.current)+' / '+tp(g.target)+'</span><span style="font-weight:bold;color:var(--primary);">'+toPer(pct.toFixed(0))+'٪</span></div></div>';
    });
  }
  h+='</div></div>';
  h+=`<div style="margin-top:24px;text-align:center;"><button onclick="printReportCard('${child.name.replace(/'/g,"\\'")}')" style="padding:14px 32px;background:linear-gradient(135deg,var(--primary) 0%,#0a3540 100%);color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;">📄 چاپ کارنامه</button></div>`;
  main.innerHTML=h;
}

let messagesCache={conversations:[],availableUsers:[]};
async function loadMessages(context){
  const token=getAuthToken();
  if(!token){showToast('ابتدا وارد شوید');return;}
  try{
    const res=await fetch('/api/portal/messages',{headers:{'Authorization':`Bearer ${token}`}});
    if(!res.ok)throw new Error('خطا در بارگذاری');
    const data=await res.json();
    messagesCache=data;
    // Highlight message tab if there are unread messages
  const unreadCount=conversations.reduce((s,c)=>s+c.unreadCount,0);

    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">توضیحات</label><textarea id="asg-desc" placeholder="شرح تکلیف..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;height:70px;"></textarea></div>'+
    '<div style="margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">📅 مهلت تحویل (تاریخ)</label><input type="date" id="asg-due" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;"></div><div><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">⏰ ساعت</label><input type="time" id="asg-due-time" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;"></div></div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">📎 فایل پیوست (حداکثر ۱۰ مگابایت) (اختیاری)</label><input type="file" id="asg-file" style="width:100%;font-size:11px;"></div>'+
    '<div style="display:flex;gap:6px;"><button id="asg-save" style="flex:1;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit;">➕ ایجاد تکلیف</button><button onclick="closeModal(document.querySelector(\'.overlay-active\'))" style="padding:12px 16px;background:var(--hover);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;">انصراف</button></div>';
  overlay.appendChild(modal);
  overlay.classList.add('overlay-active');
  document.body.appendChild(overlay);
  escClose(overlay);
  document.getElementById('asg-save').onclick=async()=>{
    const subject=document.getElementById('asg-subject').value;
    const title=document.getElementById('asg-title').value.trim();
    const description=document.getElementById('asg-desc').value.trim();
    // Convert Gregorian date input to Persian (Jalali) format with time
    let dueDate='';
    const dateInput=document.getElementById('asg-due').value;
    const timeInput=document.getElementById('asg-due-time')?.value||'';
    if(dateInput){
      try{
        const d=new Date(dateInput+'T00:00:00');
        const persianDate=d.toLocaleDateString('fa-IR-u-nu-latn',{year:'2-digit',month:'2-digit',day:'2-digit'});
        dueDate=persianDate.replace(/\//g,'/');
        if(timeInput)dueDate+=' '+timeInput;
      }catch(e){dueDate=dateInput+(timeInput?' '+timeInput:'');}
    }
    const fileInput=document.getElementById('asg-file');
    if(!title){showToast('عنوان لازم است');return;}
    let fileData=null,fileName=null;
    if(fileInput.files[0]){
      const f=fileInput.files[0];
      if(f.size>10485760){showToast('⚠️ فایل بزرگ است (حداکثر ۱۰ مگابایت)');return;}
      fileName=f.name;
      fileData=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    }
    // Try API first; if it fails, save directly to Supabase
    const btn=document.getElementById('asg-save');
    btn.disabled=true;btn.textContent='⏳ در حال ایجاد...';
    let ok=false;
    try{
      const token=getAuthToken();
      const res=await fetch('/api/portal/assignments',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({action:'create',payload:{classCode:S.currentClass,subject,title,description,dueDate,fileData,fileName}})});
      if(res.ok)ok=true;
    }catch(e){}
    if(!ok){
      // Fallback: save directly to Supabase
      const sb=getSupabase();
      if(sb){
        const userId=localStorage.getItem('portal_user_id');
        try{
          const{data:cls}=await sb.from('classes').select('id').eq('name',S.currentClass).single();
          const{error}=await sb.from('assignments').insert({
            class_id:cls?.id||null,
            class_code:S.currentClass,
            teacher_id:userId,
            subject,title,description,
            due_date:dueDate||null,
            file_data:fileData,
            file_name:fileName
          });
          if(error)throw error;
          ok=true;
        }catch(e){showToast('❌ '+e.message);btn.disabled=false;btn.textContent='➕ ایجاد تکلیف';return;}
      }
    }
    closeModal(overlay);
    showToast('✅ تکلیف ساخته شد');
    loadAssignments('teacher');
  };
}
function openGradeSubmissionModal(submissionId){
  // Find submission across all assignments
  let submission=null,assignment=null;
  for(const a of assignmentsCache){
    const s=a.submissions.find(x=>x.id===submissionId);
    if(s){submission=s;assignment=a;break;}
  }
  if(!submission){showToast('پاسخ یافت نشد');return;}
  const gradeScale=getGradeScale();
  const statusOptions=['کامل','ناقص و نیاز به اصلاح','عدم'];
  const existingVoice=localStorage.getItem('voice_feedback_'+submissionId)||'';
  const overlay=makeOverlay();
  const modal=makeModal();
  modal.style.maxWidth='500px';
  modal.innerHTML='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:36px;">💯</div><h3 style="color:var(--primary);margin-top:6px;font-size:16px;">ارزیابی تکلیف</h3><p style="font-size:12px;color:var(--text-light);margin-top:4px;">'+submission.studentName+' — '+assignment.title+'</p></div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">📊 وضعیت</label><select id="grade-status" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;"><option value="">— انتخاب —</option>'+statusOptions.map(o=>`<option value="${o}" ${submission.descriptiveGrade===o?'selected':''}>${o}</option>`).join('')+'</select></div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">💯 نمره (۰ تا '+toPer(gradeScale)+')</label><input type="text" inputmode="decimal" id="grade-num" value="'+(submission.numericalGrade||'')+'" placeholder="مثلاً: 9" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;"></div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">📝 یادداشت</label><textarea id="grade-feedback" placeholder="یادداشت برای دانش‌آموز..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;height:60px;">'+(submission.feedback||'')+'</textarea></div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">🎤 بازخورد صوتی</label><div id="voice-feedback-area" style="display:flex;flex-direction:column;gap:6px;"></div></div>'+
    '<div style="display:flex;gap:6px;"><button id="grade-save" style="flex:1;padding:12px;background:var(--success);color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit;">💾 ذخیره ارزیابی</button><button onclick="closeModal(document.querySelector(\'.overlay-active\'))" style="padding:12px 16px;background:var(--hover);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;">انصراف</button></div>';
  overlay.appendChild(modal);
  overlay.classList.add('overlay-active');
  document.body.appendChild(overlay);
  escClose(overlay);
  // Initialize voice feedback area
  const voiceArea=document.getElementById('voice-feedback-area');
  if(voiceArea){
    if(existingVoice){
      voiceArea.innerHTML='<div style="display:flex;align-items:center;gap:6px;"><audio controls src="'+existingVoice+'" style="height:30px;flex:1;"></audio></div><button onclick="clearVoiceFeedback('+submissionId+')" style="padding:6px;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);border-radius:4px;font-size:11px;cursor:pointer;">🗑️ حذف صوت</button><button onclick="startVoiceRecord(\'voice-feedback-area\','+submissionId+',true)" style="padding:6px;background:var(--hover);border:1px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer;">🎤 ضبط مجدد</button>';
    }else{
      voiceArea.innerHTML='<button onclick="startVoiceRecord(\'voice-feedback-area\','+submissionId+',true)" style="padding:10px;background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">🎤 ضبط بازخورد صوتی</button>';
    }
  }
  document.getElementById('grade-save').onclick=async()=>{
    const numericalGrade=document.getElementById('grade-num').value.trim();
    const descriptiveGrade=document.getElementById('grade-status').value;
    const feedback=document.getElementById('grade-feedback').value.trim();
    const voiceData=localStorage.getItem('voice_feedback_'+submissionId)||'';
    const sb=getSupabase();
    const btn=document.getElementById('grade-save');
    btn.disabled=true;btn.textContent='⏳ در حال ذخیره...';
    try{
      // Try API first; if it fails (offline mode), use Supabase directly
      let gradeOk=false;
      try{
        const token=getAuthToken();
        const res=await fetch('/api/portal/assignments',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({action:'grade',payload:{submissionId,numericalGrade,descriptiveGrade,feedback}})});
        if(res.ok)gradeOk=true;
      }catch(e){}
      // Fallback: save directly to Supabase
      if(!gradeOk&&sb){
        await sb.from('submissions').update({
          numerical_grade:numericalGrade||null,
          descriptive_grade:descriptiveGrade||null,
          feedback:feedback||null,
          voice_feedback:voiceData||null,
          graded_at:new Date().toISOString()
        }).eq('id',submissionId);
        gradeOk=true;
      }
      // Send feedback notification to the student AND their parent (via messages table)
      if(gradeOk&&sb){
        try{
          const userId=localStorage.getItem('portal_user_id');
          const myUser=await sb.from('users').select('id,name,role').eq('id',userId).single();
          const myName=myUser.data?.name||'آموزگار';
          // Find the student's user record by name
          const studentRes=await sb.from('users').select('id,name,role,class_code').eq('name',submission.studentName).eq('role','STUDENT');
          if(studentRes.data&&studentRes.data.length>0){
            const studentUser=studentRes.data[0];
            // Send to student
            const gradeText=descriptiveGrade?('📊 '+descriptiveGrade):'';
            const numText=numericalGrade?('💯 نمره: '+numericalGrade):'';
            const fbText=feedback?('💬 '+feedback):'';
            const msgBody='📚 تکلیف «'+assignment.title+'» ارزیابی شد.\n'+gradeText+(gradeText&&numText?' • ':'')+numText+(fbText?'\n'+fbText:'')+(voiceData?'\n🎤 بازخورد صوتی ضبط شده':'');
            await sb.from('messages').insert({
              from_user_id:userId,
              to_user_id:studentUser.id,
              subject:'📚 بازخورد تکلیف: '+assignment.title,
              body:msgBody,
              file_data:voiceData||null,
              file_name:voiceData?'بازخورد صوتی.webm':null
            });
            // Also try to find and notify the parent (name like "ولی "+studentName)
            const parentName='ولی '+submission.studentName;
            const parentRes=await sb.from('users').select('id,name,role,class_code').eq('name',parentName).eq('role','PARENT');
            if(parentRes.data&&parentRes.data.length>0){
              await sb.from('messages').insert({
                from_user_id:userId,
                to_user_id:parentRes.data[0].id,
                subject:'📚 بازخورد تکلیف فرزند: '+assignment.title,
                body:msgBody.replace('تکلیف','تکلیف فرزند'),
                file_data:voiceData||null,
                file_name:voiceData?'بازخورد صوتی.webm':null
              });
            }
          }
        }catch(e){console.warn('Could not send feedback notification:',e.message);}
      }
      closeModal(overlay);
      showToast('✅ ارزیابی ثبت شد و بازخورد برای دانش‌آموز و ولی ارسال شد');
      loadAssignments('teacher');
    }catch(e){showToast('❌ '+e.message);btn.disabled=false;btn.textContent='💾 ذخیره ارزیابی';}
  };
}
async function deleteAssignment(assignmentId){
  if(!confirm('این تکلیف و همه پاسخ‌های آن حذف شود؟'))return;
  const token=getAuthToken();
  try{
    const res=await fetch('/api/portal/assignments',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({action:'delete',payload:{assignmentId}})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'خطا');
    showToast('🗑️ تکلیف حذف شد');
    loadAssignments('teacher');
  }catch(e){showToast('❌ '+e.message);}
}

function renderMessagesUI(container,context){
  const {conversations,availableUsers}=messagesCache;
  let h='<div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;">';
  // Sidebar: conversations + new message button
  h+='<div><div style="display:flex;gap:6px;margin-bottom:8px;"><button onclick="openNewMessageModal(\''+context+'\')" class="add-btn" style="margin-top:0;flex:1;">✉️ پیام جدید</button></div>';
  h+='<div style="background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:8px;max-height:400px;overflow-y:auto;">';
  if(conversations.length===0)h+='<div style="text-align:center;padding:20px;color:var(--text-light);">هنوز پیامی ندارید</div>';
  conversations.forEach(c=>{
    const lastMsg=c.messages[0]||{};
    h+=`<div onclick="selectConversation('${c.partnerId}')" style="padding:8px;border-radius:6px;cursor:pointer;margin-bottom:4px;background:${c.unreadCount>0?'var(--primary-light)':'var(--hover)'};" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:bold;">${c.partnerName}${c.unreadCount>0?'<span style="background:var(--accent);color:white;border-radius:10px;padding:1px 6px;font-size:9px;">'+tp(c.unreadCount)+'</span>':''}</div><div style="font-size:11px;color:var(--text-light);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${lastMsg.body||''}</div></div>`;
  });

// Notification sound for new messages
let _lastUnreadCount=0;
function playMessageSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value=880; // A5 note
    gain.gain.setValueAtTime(0.3,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);
    osc.start();
    osc.stop(ctx.currentTime+0.5);
  }catch(e){}
}

// Sync settings (subjects, school name, etc.) to Supabase DB
// This ensures changes persist across logout/login
async function syncSettingsToDB(){
  // Clear state cache so changes don't get reverted on refresh
  localStorage.removeItem('portal_state_cache');
  try{
    const sb=getSupabase();
    if(!sb)return;
    const settingsToUpdate={
      'school_name':S.schoolName||'دبستان صالحین',
      'year_name':S.yearName||'۱۴۰۵-۱۴۰۶',
      'subjects':JSON.stringify(S.subjects||SB),
      'grade_scale':String(S.gradeScale||10)
    };
    if(S.homeworkOptions)settingsToUpdate['homework_options']=JSON.stringify(S.homeworkOptions);
    if(S.disciplineOptions)settingsToUpdate['discipline_options']=JSON.stringify(S.disciplineOptions);
    
    for(const [key,value] of Object.entries(settingsToUpdate)){
      try{
        const{data:check}=await sb.from('settings').select('id').eq('key',key);
        if(check&&check.length>0){
          await sb.from('settings').update({value:value,updated_at:new Date().toISOString()}).eq('key',key);
        }else{
          await sb.from('settings').insert({key:key,value:value,updated_at:new Date().toISOString()});
        }
      }catch(e){console.log('Settings sync error for '+key+':',e.message);}
    }
    console.log('✅ Settings synced to DB + cache cleared');
  }catch(e){console.log('syncSettingsToDB error:',e.message);}
}


// Cache for apiLoadState - 30 second TTL
const STATE_CACHE_KEY='portal_state_cache';
const STATE_CACHE_TTL=30000; // 30 seconds

async function apiLoadStateCached(){
  // Check cache first
  try{
    const cached=JSON.parse(localStorage.getItem(STATE_CACHE_KEY)||'null');
    if(cached&&cached.timestamp&&Date.now()-cached.timestamp<STATE_CACHE_TTL){
      console.log('✅ Using cached state (age:',Math.round((Date.now()-cached.timestamp)/1000)+'s)');
      return cached.state;
    }
  }catch(e){}
  // Cache miss - fetch from server (call the REAL apiLoadState, NOT apiLoadStateCached to avoid infinite recursion)
  const state=await apiLoadState();
  // Save to cache
  if(state){
    try{
      localStorage.setItem(STATE_CACHE_KEY,JSON.stringify({state,timestamp:Date.now()}));
    }catch(e){}
  }
  return state;
}

function init(){
  loadS();applyTheme();
  // Enable right-click context menu (new tab, copy link, etc.) — user request #5
  // No blocking of context menu anywhere
  // Enable text selection for copy/paste
  document.body.style.userSelect='auto';
  document.body.style.webkitUserSelect='auto';
  // Always sync SB from S.subjects after loading state
  if(typeof syncSB==='function')syncSB();
  // Check if user has an active session (auto-login on refresh)
  const token=getAuthToken();
  const userId=localStorage.getItem('portal_user_id');
  const savedRole=localStorage.getItem('portal_role')||S.currentRole;
  if(token&&userId&&savedRole){
    // Show loading indicator while fetching data
    document.body.innerHTML+='<div id="init-loading" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card-bg);padding:24px 40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:9999;text-align:center;"><div style="font-size:32px;margin-bottom:8px;">⏳</div><div style="color:var(--primary);font-weight:bold;font-size:14px;">در حال بارگذاری...</div></div>';
    // Load fresh data from server FIRST, then enter app
    // Use direct Supabase call instead of apiLoadStateCached (which may not be defined yet)
    var _initLoadDone=false;
    function _doEnterApp(){
      if(_initLoadDone)return;_initLoadDone=true;
      var el=document.getElementById('init-loading');if(el)el.remove();
      var savedView=localStorage.getItem('portal_active_view');
      try{
        if(savedRole==='parent'){enterParentPortal();}
        else if(savedRole==='student'){enterStudentPortal();}
        else{enterApp(savedRole);}
      }catch(e){console.log('Enter app error:',e.message);showStartScreen();}
      if(savedView){
        setTimeout(function(){
          try{
            var tab=document.querySelector('[data-view="'+savedView+'"]');
            if(tab){
              document.querySelectorAll('.nav-tab').forEach(function(el){el.classList.remove('active');});
              tab.classList.add('active');
              switchView(savedView);
            }
          }catch(e){}
        },500);
      }
    }
    // Try to load data via apiLoadStateCached if available
    if(typeof apiLoadStateCached==='function'){
      apiLoadStateCached().then(function(state){
        if(state){
          var savedClass=S.currentClass;
          var savedMonth=S.currentMonth;
          // === CRITICAL: MERGE instead of REPLACE ===
          // Preserve local grades/attendance/photos if they exist — only merge in fresh data from Supabase
          // (so we don't wipe data that was entered locally but hasn't synced yet)
          mergeStateIntoS(state);
          S.currentClass=savedClass||state.currentClass;
          S.currentMonth=savedMonth||state.currentMonth;
          if(typeof syncSB==='function')syncSB();
          saveS();
        }
        _doEnterApp();
      }).catch(function(e){
        console.log('Auto-load error:',e.message);
        _doEnterApp();
      });
    }else if(typeof apiLoadState==='function'){
      // Fallback to apiLoadState
      apiLoadState().then(function(state){
        if(state){
          var savedClass=S.currentClass;
          var savedMonth=S.currentMonth;
          // === CRITICAL: MERGE instead of REPLACE ===
          mergeStateIntoS(state);
          S.currentClass=savedClass||state.currentClass;
          S.currentMonth=savedMonth||state.currentMonth;
          if(typeof syncSB==='function')syncSB();
          saveS();
        }
        _doEnterApp();
      }).catch(function(e){
        console.log('Auto-load error (fallback):',e.message);
        _doEnterApp();
      });
    }else{
      // Neither function available - just enter app with cached data
      console.log('No state loader available, using cached data');
      _doEnterApp();
    }
    // Timeout safety - if data load takes too long, enter app anyway
    setTimeout(function(){_doEnterApp();},15000);
    return;
  }
  showStartScreen();
  // Start real-time polling for messages (every 30 seconds)
  setInterval(async()=>{
    // Only poll if user is logged in
    const token=getAuthToken();
    if(!token)return;
    const sb=getSupabase();
    if(!sb)return;
    const userId=localStorage.getItem('portal_user_id');
    if(!userId)return;
    try{
      // Check for unread messages
      const{data:unread}=await sb.from('messages').select('id').eq('to_user_id',userId).eq('read',false);
      const unreadCount=unread?unread.length:0;
      // Play sound if new messages arrived
      if(unreadCount>_lastUnreadCount&&_lastUnreadCount>=0){
        playMessageSound();
      }
      _lastUnreadCount=unreadCount;
      // Update message tab indicator
      const msgTab=document.querySelector('.nav-tab[data-view*="messages"]');
      if(msgTab){
        if(unreadCount>0){
          msgTab.classList.add('msg-unread');
          // Also update the title with count if possible
          if(!msgTab.dataset.originalText){
            msgTab.dataset.originalText=msgTab.textContent;
          }
        }else{
          msgTab.classList.remove('msg-unread');
        }
      }
      // If we're currently viewing messages, refresh them
      const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
      if(activeView&&activeView.includes('messages')){
        // Don't auto-refresh if user is typing a reply
        const replyText=document.getElementById('reply-text');
        if(!replyText||!replyText.value.trim()){
          const context=activeView.includes('student')?'student':activeView.includes('parent')?'parent':'teacher';
          loadMessages(context);
        }
      }
    }catch(e){/* silent fail */}
  },30000); // 30 seconds
  
  // Auto-refresh state every 2 minutes (for new grades, attendance, etc.)
  setInterval(async()=>{
    const token=getAuthToken();
    if(!token)return;
    const sb=getSupabase();
    if(!sb)return;
    // Reload state silently
    try{
      const state=await apiLoadStateCached();
      if(state){
        // Merge with existing state but preserve current selections
        const savedClass=S.currentClass;
        const savedMonth=S.currentMonth;
        const savedSubject=S.currentSubject;
        const savedDate=S.currentDate;
        // Merge state instead of replacing (preserve local data)
        mergeStateIntoS(state);
        S.currentClass=savedClass||state.currentClass;
        S.currentMonth=savedMonth||state.currentMonth;
        S.currentSubject=savedSubject||state.currentSubject;
        S.currentDate=savedDate||state.currentDate;
        // Don't saveS() here to avoid loops
        // Re-render current view
        const activeView=document.querySelector('.nav-tab.active')?.dataset.view;
        if(activeView){
          switchView(activeView);
        }
      }
    }catch(e){/* silent fail */}
  },120000); // 2 minutes
}
init();

// Override apiLogin to use Supabase
window.apiLogin = async function(username,password,classCode){
  let sb=getSupabase();
  if(!sb){
    // Wait for SDK to load
    for(let i=0;i<20&&!sb;i++){
      await new Promise(r=>setTimeout(r,200));
      sb=getSupabase();
    }
  }
  if(!sb)throw new Error('اتصال به سرور برقرار نشد. صفحه را refresh کنید');
  // Query user from Supabase
  let userData=null,userError=null;
  try{
    const result=await sb.from('users').select('*').eq('username',username).single();
    userData=result.data;
    userError=result.error;
    // If data is not an object (HTML response), treat as error
    if(userData && typeof userData!=='object'){
      console.error('Unexpected response type:',typeof userData);
      userData=null;
      userError={message:'سرور پاسخ نامعتبر داد'};
    }
  }catch(e){
    userError={message:e.message};
    console.error('Query error:',e);
  }
  if(userError||!userData)throw new Error('نام کاربری یا رمز اشتباه است');
  const data=userData;
  // Smart password verification: support BOTH bcrypt hashes AND plaintext
  const storedHash=data.password_hash||'';
  let valid=false;
  if(storedHash.startsWith('$2a$')||storedHash.startsWith('$2b$')||storedHash.startsWith('$2y$')){
    // Bcrypt hash — use bcrypt.compareSync
    try{
      valid=bcrypt.compareSync(password,storedHash);
    }catch(e){
      console.error('bcrypt compare error:',e);
      valid=false;
    }
  }else{
    // Plaintext password — direct string comparison
    valid=(password===storedHash);
  }
  if(!valid)throw new Error('نام کاربری یا رمز اشتباه است');
  // Normalize class code comparison (handle Persian/English digit mismatch)
  const toPersianDigits=(s)=>String(s||'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  if(data.role==='TEACHER'&&classCode&&toPersianDigits(data.class_code)!==toPersianDigits(classCode)){
    throw new Error('این کلاس به شما تعلق ندارد');
  }
  setAuthToken('sb-'+data.id);
  localStorage.setItem('portal_user_id',data.id);
  localStorage.setItem('portal_role',data.role.toLowerCase());  // For auto-login on refresh
  return{id:data.id,username:data.username,name:data.name,role:data.role,classCode:data.class_code,mustChangePassword:data.must_change_password,displayName:data.name};
}

// Override apiQueueAction to use Supabase
function apiQueueAction(action,payload){
  if(!isOnline())return;
  pendingSyncActions.push({action,payload});
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(flushSyncActions,800);
}

window.flushSyncActions = async function(){

  if(!sb||pendingSyncActions.length===0)return;

          }catch(e){}
          const gradeData={student_id:stu.id};
          if(classId)gradeData.class_id=classId;

          if(field==='discipline')gradeData.discipline=value;
          if(field==='note')gradeData.note=value;
          if(field==='positive')gradeData.positive=value?pf(value):0;
          if(field==='negative')gradeData.negative=value?pf(value):0;
          if(field==='daily_score')gradeData.daily_score=value;
          try{
            await sb.from('grades').upsert(gradeData);
          }catch(e){
            // Columns positive/negative/daily_score may not exist yet — retry without them
            if(e&&e.message&&(e.message.indexOf('positive')>=0||e.message.indexOf('negative')>=0||e.message.indexOf('daily_score')>=0||e.message.indexOf('column')>=0)){
              const safe={student_id:stu.id};

          if(!stu)break;
          let classId=null;
          try{const{data:clsRow}=await sb.from('classes').select('id').eq('name',classCode).single();if(clsRow)classId=clsRow.id;}catch(e){}
          if(role){
            const roleData={student_id:stu.id};
            if(classId)roleData.class_id=classId;
            roleData.role=role;
            await sb.from('student_roles').upsert(roleData);
          }else{
            await sb.from('student_roles').delete().eq('student_id',stu.id);
          }
          break;
        }
      }
    }catch(e){console.error('Sync error:',action,e);}
  }
  // Update the save indicator on the monthly sheet, if it's visible
  if(typeof markSaved==='function'){
    try{markSaved();}catch(e){}
  }
}

// Override apiChangePassword to use Supabase
window.apiChangePassword = async function(currentPassword,newPassword,newUsername){
  const sb=getSupabase();
  if(!sb)throw new Error('Supabase not loaded');
  const userId=localStorage.getItem('portal_user_id');
  if(!userId)throw new Error('ابتدا وارد شوید');
  const{data:user}=await sb.from('users').select('*').eq('id',userId).single();
  if(!user)throw new Error('کاربر یافت نشد');
  // Smart password verification (same as login)
  const storedHash=user.password_hash||'';
  let valid=false;
  if(storedHash.startsWith('$2a$')||storedHash.startsWith('$2b$')||storedHash.startsWith('$2y$')){
    try{valid=bcrypt.compareSync(currentPassword,storedHash);}catch(e){valid=false;}
  }else{
    valid=(currentPassword===storedHash);
  }
  if(!valid)throw new Error('رمز فعلی اشتباه است');
  const newHash=bcrypt.hashSync(newPassword,10);
  await sb.from('users').update({username:newUsername,password_hash:newHash,must_change_password:false}).eq('id',userId);
  return{success:true};
}

// Override messages loading
async function loadMessages(context){
  const sb=getSupabase();
  if(!sb)return;
  const userId=localStorage.getItem('portal_user_id');
  if(!userId)return;
  try{
    // Fetch current user data (needed for role-based filtering)
    const{data:user}=await sb.from('users').select('*').eq('id',userId).single();
    if(!user)return;
    const{data:allUsers}=await sb.from('users').select('id,username,name,role,class_code');
    const{data:msgs}=await sb.from('messages').select('*').or(`from_user_id.eq.${userId},to_user_id.eq.${userId}`).order('created_at',{ascending:false}).limit(200);
    const conversationsMap={};
    (msgs||[]).forEach(m=>{
      const partnerId=m.from_user_id===userId?m.to_user_id:m.from_user_id;
      if(!conversationsMap[partnerId]){
        const partner=allUsers.find(u=>u.id===partnerId);
        conversationsMap[partnerId]={partnerId,partnerName:partner?partner.name:'نامشخص',partnerUsername:partner?partner.username:'',partnerRole:partner?partner.role:'',partnerClass:partner?partner.class_code:'',messages:[],lastMessageAt:m.created_at,unreadCount:0};
      }
      conversationsMap[partnerId].messages.push({id:m.id,fromMe:m.from_user_id===userId,subject:m.subject,body:m.body,fileName:m.file_name,hasFile:!!m.file_data,fileData:m.file_data,read:m.read,createdAt:new Date(m.created_at).toISOString()});
      if(!m.read&&m.to_user_id===userId)conversationsMap[partnerId].unreadCount++;
    });
    const conversations=Object.values(conversationsMap).sort((a,b)=>new Date(b.lastMessageAt)-new Date(a.lastMessageAt));
    // Filter available users based on role
    let availableUsers=(allUsers||[]).filter(u=>u.id!==userId);
    // For parents: only allow messaging admin, vice, and their child's teacher
    if(user.role==='PARENT'){
      const parentClass=user.class_code;
      availableUsers=availableUsers.filter(u=>{
        if(u.role==='ADMIN'||u.role==='VICE')return true;
        // Teacher of the parent's child's class
        if(u.role==='TEACHER'&&u.class_code===parentClass)return true;
        return false;
      });
    }
    // For students: only allow messaging admin, vice, and their class teacher
    if(user.role==='STUDENT'){
      const studentClass=user.class_code;
      availableUsers=availableUsers.filter(u=>{
        if(u.role==='ADMIN'||u.role==='VICE')return true;
        if(u.role==='TEACHER'&&u.class_code===studentClass)return true;
        // Also allow messaging their parents (if same name pattern)
        if(u.role==='PARENT'&&u.name.includes(user.name))return true;
        return false;
      });
    }
    messagesCache={conversations,availableUsers};
    // Highlight message tab if there are unread messages
  const unreadCount=conversations.reduce((s,c)=>s+c.unreadCount,0);
  document.querySelectorAll('.nav-tab[data-view*="messages"]').forEach(t=>{
    if(unreadCount>0){t.classList.add('msg-unread');}
    else{t.classList.remove('msg-unread');}
  });
  if(context==='student')renderStudentMessages();
    else if(context==='parent')renderParentMessages();
    else renderTeacherMessages();
  }catch(e){console.error('loadMessages error:',e);const main=document.getElementById('view-messages')||document.getElementById('view-teacher-messages')||document.getElementById('view-student-messages')||document.getElementById('view-parent-messages');if(main)main.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-light);">💬 هنوز پیامی ندارید<br><span style="font-size:11px;">برای ارسال پیام، روی «✉️ پیام جدید» کلیک کنید</span></div>';}
}

// Override send message
async function sendReply(partnerId){
  const sb=getSupabase();
  const userId=localStorage.getItem('portal_user_id');
  const text=document.getElementById('reply-text').value.trim();
  const fileInput=document.getElementById('reply-file');
  const voiceData=getMsgVoiceData();
  if(!text&&!fileInput.files[0]&&!voiceData){showToast('متن یا فایل یا پیام صوتی لازم است');return;}
  let fileData=null,fileName=null;
  if(fileInput.files[0]){
    const f=fileInput.files[0];
    if(f.size>10485760){showToast('⚠️ فایل بزرگ است (حداکثر ۱۰ مگابایت)');return;}
    fileName=f.name;
    fileData=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
  }
  // If voice data exists, use it as file_data
  if(voiceData){
    fileData=voiceData;
    fileName='پیام صوتی.'+mimeToFileExt(_voiceMimeUsed);
  }
  try{
    await sb.from('messages').insert({from_user_id:userId,to_user_id:partnerId,subject:null,body:text,file_data:fileData,file_name:fileName});
    showToast('✅ پیام ارسال شد');
    document.getElementById('reply-text').value='';
    document.getElementById('reply-file').value='';
    // Clear voice area
    const voiceArea=document.getElementById('reply-voice-area');
    if(voiceArea)voiceArea.innerHTML='';
    const context=document.querySelector('.nav-tab.active')?.dataset.view?.includes('student')?'student':document.querySelector('.nav-tab.active')?.dataset.view?.includes('parent')?'parent':'teacher';
    loadMessages(context);
  }catch(e){showToast('❌ '+e.message);}
}


// Delete message (works for both sender and receiver - database level)
async function deleteMessage(msgId){
  if(!confirm('این پیام حذف شود؟ (برای هر دو طرف حذف می‌شود)'))return;
  try{
    const sb=getSupabase();
    if(!sb){showToast('اتصال به سرور نیست');return;}
    const{error}=await sb.from('messages').delete().eq('id',msgId);
    if(error)throw error;
    showToast('🗑️ پیام حذف شد');
    // Reload messages
    const context=document.querySelector('.nav-tab.active')?.dataset.view?.includes('student')?'student':document.querySelector('.nav-tab.active')?.dataset.view?.includes('parent')?'parent':'teacher';
    loadMessages(context);
  }catch(e){showToast('❌ '+e.message);}
}

// Edit message (only for messages you sent)
async function editMessage(msgId,oldText){
  const newText=prompt('ویرایش پیام:',oldText);
  if(newText===null)return; // Cancelled
  if(newText.trim()===oldText.trim())return; // No change
  if(!newText.trim()){showToast('متن نمی‌تواند خالی باشد');return;}
  try{
    const sb=getSupabase();
    if(!sb){showToast('اتصال به سرور نیست');return;}
    const{error}=await sb.from('messages').update({body:newText.trim()}).eq('id',msgId);
    if(error)throw error;
    showToast('✅ پیام ویرایش شد');
    const context=document.querySelector('.nav-tab.active')?.dataset.view?.includes('student')?'student':document.querySelector('.nav-tab.active')?.dataset.view?.includes('parent')?'parent':'teacher';
    loadMessages(context);
  }catch(e){showToast('❌ '+e.message);}
}

// Override selectConversation to mark messages as read in Supabase

  const msgs=[...conv.messages].reverse();
  msgs.forEach(m=>{
    h+=`<div style="margin-bottom:8px;text-align:${m.fromMe?'left':'right'};"><div style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:12px;background:${m.fromMe?'var(--primary)':'var(--hover)'};color:${m.fromMe?'white':'var(--text)'};">`;

    h+=`<div style="font-size:9px;opacity:0.6;margin-top:4px;display:flex;align-items:center;gap:4px;justify-content:${m.fromMe?'flex-end':'flex-start'};">${new Date(m.createdAt).toLocaleString('fa-IR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}${m.fromMe?(m.read?'<span style="color:#4FC3F7;">✓✓</span>':'<span style="color:#999;">✓✓</span>'):''} <button onclick="deleteMessage('${m.id}')" style="font-size:8px;cursor:pointer;background:none;border:none;color:inherit;opacity:0.5;padding:0 2px;" title="حذف">🗑️</button>${m.fromMe?'<button onclick="editMessage(\''+m.id+'\',\''+(m.body||'').replace(/'/g,'\\\\\'')+'\')" style="font-size:8px;cursor:pointer;background:none;border:none;color:inherit;opacity:0.5;padding:0 2px;" title="ویرایش">✏️</button>':''}</div></div></div>`;
  });
  h+='</div>';
  h+=`<div style="border-top:1px solid var(--border);padding-top:8px;"><textarea id="reply-text" placeholder="پاسخ..." style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;height:60px;margin-bottom:6px;"></textarea><div style="display:flex;gap:6px;align-items:center;"><button onclick="startMsgVoiceRecord('reply-voice-area')" id="reply-voice-btn" style="padding:8px 12px;background:var(--danger);color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px;" title="ضبط پیام صوتی">🎤</button><div id="reply-voice-area" style="flex:1;display:flex;align-items:center;"></div><input type="file" id="reply-file" style="flex:1;font-size:11px;"><button onclick="sendReply('${partnerId}')" class="add-btn" style="margin-top:0;">📤 ارسال</button></div></div>`;
  display.innerHTML=h;
  // Mark as read in Supabase
  if(conv.unreadCount>0){
    const sb=getSupabase();
    const userId=localStorage.getItem('portal_user_id');
    if(sb&&userId){
      // Update messages in Supabase: set read=true where to_user_id=me and from_user_id=partner and read=false
      const unreadMsgIds=conv.messages.filter(m=>!m.read&&!m.fromMe).map(m=>m.id);
      unreadMsgIds.forEach(async(msgId)=>{
        try{
          await sb.from('messages').update({read:true}).eq('id',msgId);
        }catch(e){console.log('markAsRead error:',e.message);}
      });
    }
    // Update local cache
    conv.messages.filter(m=>!m.read&&!m.fromMe).forEach(m=>{m.read=true;});
    conv.unreadCount=0;
    // Refresh unread indicator on message tab
    setTimeout(()=>{
      const msgTab=document.querySelector('.nav-tab[data-view*="messages"]');
      if(msgTab){
        const totalUnread=messagesCache.conversations.reduce((s,c)=>s+c.unreadCount,0);
        if(totalUnread===0)msgTab.classList.remove('msg-unread');
      }
      // Reload messages from server to refresh
      const context=document.querySelector('.nav-tab.active')?.dataset.view?.includes('student')?'student':document.querySelector('.nav-tab.active')?.dataset.view?.includes('parent')?'parent':'teacher';
      try{loadMessages(context);}catch(e){}
    },300);
  }
}

      useClassCode=true;
    }else if(user.role==='STUDENT'&&user.class_code){
      classFilter=user.class_code;
      useClassCode=true;
    }else if(user.role==='PARENT'){
      // Find child's class
      if(user.class_code){
        classFilter=user.class_code;
        useClassCode=true;
      }
    }
    
    let query=sb.from('assignments').select('*');
    if(classFilter){
      if(useClassCode){
        query=query.eq('class_name',classFilter);
      }else{
        query=query.eq('class_id',classFilter);
      }
    }
    // Also filter by subject if currentSubject is set (for teacher/admin)
    if(S.currentSubject&&(user.role==='ADMIN'||user.role==='VICE'||user.role==='TEACHER')){
      query=query.eq('subject',S.currentSubject);
    }

    // Get submissions for each assignment
    const result=[];
    for(const a of assigns||[]){

      const{data:cls}=await sb.from('classes').select('name').eq('id',a.class_id).single();
      result.push({
        id:a.id,classId:a.class_id,subject:a.subject,title:a.title,
        description:a.description,dueDate:a.due_date,
        fileName:a.file_name,hasFile:!!a.file_data,fileData:a.file_data,
        createdByName:'',createdAt:new Date(a.created_at).toISOString(),

          id:s.id,studentName:s.student_name,studentId:s.student_id,

          feedback:s.feedback,submittedAt:new Date(s.submitted_at).toISOString(),
          gradedAt:s.graded_at?new Date(s.graded_at).toISOString():null
        }))
      });
    }
    assignmentsCache=result;
    if(context==='student')renderStudentHomeworkList();
    else if(context==='teacher')renderTeacherAssignmentsList();
  }catch(e){showToast('❌ '+e.message);}
}

// Voice feedback recording
let _voiceMediaRecorder=null;
// Voice recording variables already declared in first script block
// let _voiceChunks=[];  -- REMOVED (duplicate)
// let _voiceStartTime=0;  -- REMOVED (duplicate)
let _voiceTimerInterval=null;
let _voiceFeedbackBase64=null;

async function startVoiceFeedback(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=pickSupportedVoiceMime();
    _voiceMimeUsed=mime;
    _voiceChunks=[];
    try{
      _voiceMediaRecorder=new MediaRecorder(stream,{mimeType:mime});
    }catch(e){
      _voiceMediaRecorder=new MediaRecorder(stream);
    }
    _voiceMediaRecorder.ondataavailable=e=>{if(e.data.size>0)_voiceChunks.push(e.data);};
    _voiceMediaRecorder.onstop=async()=>{
      const actualMime=(_voiceMediaRecorder.mimeType)||mime;
      const blob=new Blob(_voiceChunks,{type:actualMime});
      if(blob.size>500000){showToast('⚠️ فایل صوتی بزرگ است (حداکثر ۵۰۰KB)');return;}
      // Convert to base64
      const reader=new FileReader();
      reader.onload=()=>{
        _voiceFeedbackBase64=reader.result;
        document.getElementById('voice-play-btn').style.display='inline-block';
        document.getElementById('voice-delete-btn').style.display='inline-block';
        document.getElementById('voice-record-btn').textContent='🔴 دوباره ضبط کن';
        showToast('️ بازخورد صوتی ضبط شد');
      };
      reader.readAsDataURL(blob);
      // Stop all tracks
      stream.getTracks().forEach(t=>t.stop());
    };
    _voiceMediaRecorder.start();
    _voiceStartTime=Date.now();
    document.getElementById('voice-record-btn').style.display='none';
    document.getElementById('voice-stop-btn').style.display='inline-block';
    // Start timer
    _voiceTimerInterval=setInterval(()=>{
      const elapsed=Math.floor((Date.now()-_voiceStartTime)/1000);
      const m=Math.floor(elapsed/60),s=elapsed%60;
      document.getElementById('voice-timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    },1000);
  }catch(e){showToast('⚠️ دسترسی به میکروفون ممکن نشد');}
}

function stopVoiceFeedback(){
  if(_voiceMediaRecorder&&_voiceMediaRecorder.state==='recording'){
    _voiceMediaRecorder.stop();
    clearInterval(_voiceTimerInterval);
    document.getElementById('voice-stop-btn').style.display='none';
    document.getElementById('voice-record-btn').style.display='inline-block';
    document.getElementById('voice-timer').textContent='';
  }
}

function playVoiceFeedback(){
  if(_voiceFeedbackBase64){
    const audio=new Audio(_voiceFeedbackBase64);
    audio.play();
  }else{
    // Try to load from submission
    showToast('پخش بازخورد صوتی...');
  }
}

function deleteVoiceFeedback(){
  _voiceFeedbackBase64=null;
  document.getElementById('voice-play-btn').style.display='none';
  document.getElementById('voice-delete-btn').style.display='none';
  document.getElementById('voice-record-btn').textContent='🔴 ضبط';
  showToast('🗑️ بازخورد صوتی حذف شد');
}

// ====== STUDENT PERMISSION SYSTEM ======
// Permissions stored in localStorage + synced to settings table as JSON

function getStudentPermissions(){
  // Returns array of {studentName, classCode, type, startDate, endDate, grantedBy, active}
  // Only read from localStorage - DB loading is done by loadStudentPermissions() after login
  let perms=JSON.parse(localStorage.getItem('student_permissions')||'[]');
  // Get today's date in Persian format (matching the permission date format)
  const todayFa=new Date().toLocaleDateString('fa-IR-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/');
  const toFa=(s)=>String(s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const today=toFa(todayFa);
  // Convert Persian digits to English for comparison
  const toEn=(s)=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  return perms.map(p=>{
    const startEn=toEn(p.startDate||'');
    const endEn=toEn(p.endDate||'');
    const todayEn=toEn(today);
    return {...p, active: startEn<=todayEn && endEn>=todayEn};
  });
}

async function loadStudentPermissions(){
  // Load from settings table
  try{
    const sb=getSupabase();
    if(!sb)return getStudentPermissions();
    const{data}=await sb.from('settings').select('*').eq('key','student_permissions').single();
    if(data&&data.value){
      const perms=JSON.parse(data.value);
      localStorage.setItem('student_permissions',JSON.stringify(perms));
      return perms;
    }
  }catch(e){}
  return getStudentPermissions();
}

async function saveStudentPermissions(perms){
  localStorage.setItem('student_permissions',JSON.stringify(perms));
  try{
    const sb=getSupabase();
    if(sb){
      // First try to UPDATE existing row
      const{data:updated,error:updateErr}=await sb.from('settings').update({value:JSON.stringify(perms),updated_at:new Date().toISOString()}).eq('key','student_permissions');
      // Check if update affected any rows
      // If no rows updated, INSERT a new row
      if(!updateErr){
        // Try to fetch to see if the row exists
        const{data:check}=await sb.from('settings').select('id').eq('key','student_permissions');
        if(!check||check.length===0){
          // Row doesn't exist - INSERT it
          await sb.from('settings').insert({key:'student_permissions',value:JSON.stringify(perms),updated_at:new Date().toISOString()});
        }
      }
    }
  }catch(e){console.log('Could not save perms to DB:',e.message);}
}

async function revokePermission(idx){
  if(!confirm('این دسترسی حذف شود؟'))return;
  const perms=JSON.parse(localStorage.getItem('student_permissions')||'[]');
  const classPerms=perms.filter(p=>p.classCode===S.currentClass);
  const permToRemove=classPerms[idx];
  if(!permToRemove)return;
  const newPerms=perms.filter(p=>p!==permToRemove);
  await saveStudentPermissions(newPerms);
  showToast('🗑️ حذف شد');
  if(window.renderPermList)window.renderPermList();
}

// Check if current user (student) has active delegate permission
function getMyActivePermission(){
  const u=getCurrentUser();
  if(!u)return null;
  const perms=getStudentPermissions();
  // Match by name OR by displayName (active flag is already computed in getStudentPermissions)
  return perms.find(p=>{
    if(!p.active)return false;
    // Try matching by name
    if(p.studentName===u.name)return true;
    if(p.studentName===u.displayName)return true;
    return false;
  });
}

  main.insertBefore(backBtn,main.firstChild);
  try{
    // Try renderAttendance first, if not available, use renderMonthly (which has attendance tab)
    if(typeof renderAttendance==='function'){
      renderAttendance();
    }else{
      // Fallback: render monthly sheet (which includes attendance)
      renderMonthly();
    }
  }catch(e){showToast('خطا: '+e.message);console.error(e);}
}

function showForgotPassword(){
  const overlay=makeOverlay();
  const modal=makeModal();
  modal.style.maxWidth='450px';
  modal.innerHTML='<div style="text-align:center;margin-bottom:16px;"><div style="font-size:36px;">🔑</div><h3 style="color:var(--primary);margin-top:6px;font-size:16px;">فراموشی رمز عبور</h3></div>'+
    '<div style="background:var(--warning-light);border:1px solid var(--warning);border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px;line-height:1.6;">'+
    '<div style="font-weight:bold;color:var(--warning);margin-bottom:6px;">📧 ارسال درخواست به مدیر</div>'+
    'نام کاربری خود را وارد کنید و در صورت نیاز توضیح بنویسید. درخواست شما در تب «اعلانات» مدیر نمایش داده می‌شود و مدیر می‌تواند رمز شما را ریست کند یا پاسخ بدهد.'+
    '</div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">نام کاربری</label><input type="text" id="fp-username" placeholder="نام کاربری شما..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;"></div>'+
    '<div style="margin-bottom:12px;"><label style="font-size:11px;color:var(--text-light);display:block;margin-bottom:4px;">یادداشت (اختیاری)</label><textarea id="fp-note" placeholder="مثلاً: کلاس ۶/۱، دانش‌آموز..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;box-sizing:border-box;height:60px;"></textarea></div>'+
    '<div style="display:flex;gap:6px;"><button id="fp-send" style="flex:1;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:bold;">📧 ارسال درخواست</button><button onclick="closeModal(document.querySelector(\'.overlay-active\'))" style="padding:12px 16px;background:var(--hover);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;">انصراف</button></div>';
  overlay.appendChild(modal);
  overlay.classList.add('overlay-active');
  document.body.appendChild(overlay);
  escClose(overlay);
  document.getElementById('fp-send').onclick=async()=>{
    const username=document.getElementById('fp-username').value.trim();
    const note=document.getElementById('fp-note').value.trim();
    if(!username){showToast('نام کاربری لازم است');return;}
    const btn=document.getElementById('fp-send');
    btn.disabled=true;btn.textContent='⏳ در حال ارسال...';
    try{
      const ok=await createPwResetRequest(username,note);
      if(ok){closeModal(overlay);}
    }catch(e){showToast('❌ '+e.message);}
    btn.disabled=false;btn.textContent='📧 ارسال درخواست';
  };
}

</script>
